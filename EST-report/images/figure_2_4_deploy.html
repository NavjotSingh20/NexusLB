<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: #FFFFFF;
    font-family: "Latin Modern Roman", "Computer Modern", "Times New Roman", Times, serif;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 100%;
  }
  .canvas {
    width: 1560px;
    height: 1150px;
    background: #FFFFFF;
    position: relative;
  }
  svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  /* Structural Boxes (LaTeX TikZ Style) */
  .host-boundary {
    fill: #FFFFFF;
    stroke: #000000;
    stroke-width: 1.6px;
    stroke-dasharray: 6,4;
    rx: 4px;
  }
  .comp-box {
    fill: #FFFFFF;
    stroke: #000000;
    stroke-width: 1.6px;
    rx: 4px;
  }
  .ext-box {
    fill: #FFFFFF;
    stroke: #000000;
    stroke-width: 1.8px;
    rx: 4px;
  }
  .subcomp-box {
    fill: #FFFFFF;
    stroke: #000000;
    stroke-width: 1.3px;
    rx: 3px;
  }

  /* Typography */
  .host-title {
    font-size: 15px;
    font-weight: bold;
    fill: #000000;
  }
  .host-sub {
    font-size: 11.5px;
    fill: #444444;
    font-style: italic;
  }
  .title-main {
    font-size: 14.5px;
    font-weight: bold;
    fill: #000000;
    text-anchor: middle;
  }
  .title-sub {
    font-size: 11.5px;
    fill: #333333;
    text-anchor: middle;
  }
  .title-italic {
    font-size: 11px;
    fill: #555555;
    font-style: italic;
    text-anchor: middle;
  }

  /* Connectors */
  .line-solid {
    fill: none;
    stroke: #000000;
    stroke-width: 1.5px;
  }
  .line-dash {
    fill: none;
    stroke: #000000;
    stroke-width: 1.4px;
    stroke-dasharray: 5,4;
  }

  /* Label Badges */
  .badge-rect {
    fill: #FFFFFF;
    stroke: #000000;
    stroke-width: 1px;
    rx: 3px;
  }
  .badge-text {
    font-size: 11px;
    font-weight: bold;
    fill: #000000;
    text-anchor: middle;
  }
</style>
</head>
<body>
<div class="canvas">
<svg viewBox="0 0 1560 1150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Arrowhead Markers -->
    <marker id="arr-black" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
    </marker>
    <marker id="arr-rev" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 8 1.5 L 0 5 L 8 8.5 z" fill="#000000" />
    </marker>
  </defs>

  <!-- ==================== EXTERNAL CLIENTS (OUTSIDE HOST BOUNDARY) ==================== -->
  <!-- 1. External HTTP Clients (Left Top) -->
  <g transform="translate(30, 170)">
    <rect class="ext-box" x="0" y="0" width="240" height="90" />
    <text class="title-main" x="120" y="32">External HTTP Clients</text>
    <text class="title-sub" x="120" y="54">Web Browsers / Load Generators</text>
    <text class="title-italic" x="120" y="74">Public Internet / Local Intranet</text>
  </g>

  <!-- 2. External DevOps Administrator (Left Bottom) -->
  <g transform="translate(30, 740)">
    <rect class="ext-box" x="0" y="0" width="240" height="90" />
    <text class="title-main" x="120" y="32">DevOps Administrator</text>
    <text class="title-sub" x="120" y="54">Real-Time Observability UI</text>
    <text class="title-italic" x="120" y="74">Port :8081 Management Session</text>
  </g>

  <!-- ==================== PHYSICAL / VIRTUAL HOST BOUNDARY ==================== -->
  <rect class="host-boundary" x="360" y="35" width="1170" height="1080" />
  <text class="host-title" x="390" y="68">Physical / Virtual Host Node (Single-Host Deployment Runtime)</text>
  <text class="host-sub" x="390" y="88">Linux (Kernel 5.15+ / WSL2) / Windows 11 Enterprise (x86_64 single static binary)</text>
  <line x1="390" y1="102" x2="1500" y2="102" stroke="#000000" stroke-width="0.8" stroke-dasharray="2,2" />

  <!-- ==================== INGRESS GATEWAY (PORT :8080) ==================== -->
  <g transform="translate(450, 145)">
    <rect class="comp-box" x="0" y="0" width="460" height="140" />
    <text class="title-main" x="230" y="28">NexusLB Ingress Gateway (:8080)</text>
    <text class="title-sub" x="230" y="54">Edge Shield Token Bucket Rate Limiter (HTTP 429)</text>
    <text class="title-sub" x="230" y="75">Layer 7 Canary Classifier &amp; 5-Strategy Balancer</text>
    <text class="title-sub" x="230" y="96">Staged retryRecorder Proxy &amp; Circuit Breakers</text>
    <text class="title-sub" x="230" y="117">Lock-Free In-Memory Metrics Ring Buffer Cache</text>
  </g>

  <!-- ==================== MANAGEMENT SERVER (PORT :8081) ==================== -->
  <g transform="translate(450, 715)">
    <rect class="comp-box" x="0" y="0" width="460" height="140" />
    <text class="title-main" x="230" y="28">Management Server (:8081)</text>
    <text class="title-sub" x="230" y="54">Embedded Dark Data-Terminal Console (embed.FS)</text>
    <text class="title-sub" x="230" y="75">1 Hz Zero-Allocation Server-Sent Events (SSE)</text>
    <text class="title-sub" x="230" y="96">Zero-Downtime Policy Hot-Swap REST Handlers</text>
    <text class="title-sub" x="230" y="117">Dual-Mode Cluster Health &amp; Telemetry Collector</text>
  </g>

  <!-- Shared Memory IPC Link between Gateway and Management Server -->
  <line class="line-solid" x1="680" y1="285" x2="680" y2="715" marker-start="url(#arr-rev)" marker-end="url(#arr-black)" />
  <rect class="badge-rect" x="550" y="488" width="260" height="26" />
  <text class="badge-text" x="680" y="505">Shared In-Memory State &amp; Ring Buffer</text>

  <!-- ==================== UPSTREAM BACKENDS (RIGHT TOP) ==================== -->
  <!-- Backend 1 -->
  <g transform="translate(1100, 125)">
    <rect class="subcomp-box" x="0" y="0" width="380" height="75" />
    <text class="title-main" x="190" y="26">Upstream Backend 1 (:8001)</text>
    <text class="title-sub" x="190" y="46">Weight: 5 | Proactive 3s Ping &amp; Circuit Breaker</text>
    <text class="title-italic" x="190" y="64">Profile: Fast Compute (Simulated Worker)</text>
  </g>

  <!-- Backend 2 -->
  <g transform="translate(1100, 230)">
    <rect class="subcomp-box" x="0" y="0" width="380" height="75" />
    <text class="title-main" x="190" y="26">Upstream Backend 2 (:8002)</text>
    <text class="title-sub" x="190" y="46">Weight: 3 | Proactive 3s Ping &amp; Circuit Breaker</text>
    <text class="title-italic" x="190" y="64">Profile: Medium I/O Workload (Chaos Target)</text>
  </g>

  <!-- Backend 3 -->
  <g transform="translate(1100, 335)">
    <rect class="subcomp-box" x="0" y="0" width="380" height="75" />
    <text class="title-main" x="190" y="26">Upstream Backend 3 (:8003)</text>
    <text class="title-sub" x="190" y="46">Weight: 1 | Proactive 3s Ping &amp; Circuit Breaker</text>
    <text class="title-italic" x="190" y="64">Profile: Heavy Database Query Workload</text>
  </g>

  <!-- ==================== AUTONOMOUS CHAOS SIMULATOR (RIGHT BOTTOM) ==================== -->
  <g transform="translate(1100, 715)">
    <rect class="comp-box" x="0" y="0" width="380" height="140" />
    <text class="title-main" x="190" y="28">Autonomous Chaos Simulator</text>
    <text class="title-sub" x="190" y="54">64 Concurrent Goroutine Worker Thread Pool</text>
    <text class="title-sub" x="190" y="75">Poisson-Jittered Traffic Generator (0–500 RPS)</text>
    <text class="title-sub" x="190" y="96">6 Configurable Multi-Vector Attack Waves</text>
    <text class="title-sub" x="190" y="117">In-Memory chaosBackup &amp; Instant Atomic Rollback</text>
  </g>

  <!-- ==================== INGRESS CONNECTIONS (EXTERNAL -> HOST) ==================== -->
  <!-- Client -> Ingress Gateway (TCP :8080) -->
  <line class="line-solid" x1="270" y1="215" x2="450" y2="215" marker-end="url(#arr-black)" />
  <rect class="badge-rect" x="280" y="204" width="72" height="22" />
  <text class="badge-text" x="316" y="219">TCP :8080</text>

  <!-- DevOps Admin -> Management Server (HTTP :8081) -->
  <line class="line-solid" x1="270" y1="785" x2="450" y2="785" marker-end="url(#arr-black)" />
  <rect class="badge-rect" x="277" y="774" width="78" height="22" />
  <text class="badge-text" x="316" y="789">HTTP :8081</text>

  <!-- ==================== PROXY DISTRIBUTION TREE (GATEWAY -> BACKENDS) ==================== -->
  <!-- Horizontal Trunk exits Gateway at Y=180 -->
  <line class="line-solid" x1="910" y1="180" x2="1060" y2="180" />
  <rect class="badge-rect" x="925" y="169" width="120" height="22" />
  <text class="badge-text" x="985" y="184">Reverse Proxy Pipe</text>

  <!-- Vertical Distribution Bus at X=1060 -->
  <line class="line-solid" x1="1060" y1="162" x2="1060" y2="372" />

  <!-- Branches into Backend Instances -->
  <line class="line-solid" x1="1060" y1="162" x2="1100" y2="162" marker-end="url(#arr-black)" />
  <line class="line-solid" x1="1060" y1="267" x2="1100" y2="267" marker-end="url(#arr-black)" />
  <line class="line-solid" x1="1060" y1="372" x2="1100" y2="372" marker-end="url(#arr-black)" />

  <!-- ==================== CHAOS TRAFFIC INJECTION (SIMULATOR -> GATEWAY) ==================== -->
  <!-- Enters Gateway at Y=255, turns at X=990, drops to Y=785, enters Simulator at X=1100 -->
  <path class="line-dash" d="M 1100 785 L 990 785 L 990 255 L 910 255" marker-end="url(#arr-black)" />
  <rect class="badge-rect" x="915" y="585" width="150" height="22" />
  <text class="badge-text" x="990" y="600">Simulated Traffic Waves</text>

</svg>
</div>
</body>
</html>
