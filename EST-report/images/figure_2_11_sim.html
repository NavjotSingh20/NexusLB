<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: #FFFFFF;
    font-family: "Latin Modern Roman", "Computer Modern", "Times New Roman", Times, serif;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 100%;
  }
  .canvas {
    width: 1560px;
    height: 800px;
    background: #FFFFFF;
    position: relative;
  }
  svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  /* State Boxes */
  .state-box {
    fill: #FFFFFF;
    stroke: #000000;
    stroke-width: 1.8px;
    rx: 6px;
  }
  .state-divider {
    stroke: #000000;
    stroke-width: 1.2px;
  }

  /* Typography */
  .state-title {
    font-size: 14.5px;
    font-weight: bold;
    fill: #000000;
    text-anchor: middle;
  }
  .state-sub {
    font-size: 11.5px;
    font-weight: normal;
    font-style: italic;
    fill: #222222;
    text-anchor: middle;
  }
  .bullet-text {
    font-size: 11px;
    font-weight: normal;
    fill: #000000;
    text-anchor: start;
  }
  .status-pill-bg {
    fill: #FFFFFF;
    stroke: #000000;
    stroke-width: 1px;
    rx: 3px;
  }
  .status-pill-text {
    font-size: 10.5px;
    font-weight: bold;
    fill: #000000;
    text-anchor: middle;
  }

  /* Initial Pseudo-State Node */
  .init-node {
    fill: #000000;
  }

  /* Connectors */
  .conn-solid {
    fill: none;
    stroke: #000000;
    stroke-width: 1.8px;
  }

  /* Badges & Labels */
  .badge-bg {
    fill: #FFFFFF;
    stroke: #000000;
    stroke-width: 1px;
    rx: 3px;
  }
  .badge-text {
    font-size: 11px;
    font-weight: bold;
    fill: #000000;
    text-anchor: middle;
  }
</style>
</head>
<body>
<div class="canvas">
<svg viewBox="0 0 1560 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#000000" />
    </marker>
  </defs>

  <!-- ==================== INITIAL PSEUDO-STATE (UML STANDARD) ==================== -->
  <!-- Clean vertical entry from top into State 1.0 center (X=260) -->
  <circle class="init-node" cx="260" cy="35" r="9" />
  <path class="conn-solid" d="M 260 44 L 260 80" marker-end="url(#arrow)" />


  <!-- ==================== STATE 1.0: PRISTINE BASELINE (X=80, Y=80, W=360, H=210) ==================== -->
  <g transform="translate(80, 80)">
    <rect class="state-box" x="0" y="0" width="360" height="210" />
    <text class="state-title" x="180" y="28">State 1.0: Pristine Baseline</text>
    <text class="state-sub" x="180" y="48">Normal Cluster Equilibrium</text>
    <line class="state-divider" x1="0" y1="58" x2="360" y2="58" />

    <text class="bullet-text" x="18" y="86">&bull; All 3 backends healthy (:8001, :8002, :8003)</text>
    <text class="bullet-text" x="18" y="108">&bull; Injected latency = 0 ms, drop rate = 0%</text>
    <text class="bullet-text" x="18" y="130">&bull; Baseline weight ratios preserved</text>

    <!-- Status Invariant Badge -->
    <g transform="translate(180, 172)">
      <rect class="status-pill-bg" x="-65" y="-11" width="130" height="22" />
      <text class="status-pill-text" x="0" y="4">Pristine Cluster</text>
    </g>
  </g>

  <!-- Connector: State 1.0 -> State 2.0 (Spans X=440 to X=600, 160px clear gap) -->
  <path class="conn-solid" d="M 440 185 L 600 185" marker-end="url(#arrow)" />
  <g transform="translate(520, 185)">
    <rect class="badge-bg" x="-48" y="-11" width="96" height="22" />
    <text class="badge-text" x="0" y="4">Trigger Wave</text>
  </g>


  <!-- ==================== STATE 2.0: SNAPSHOT & BACKUP (X=600, Y=80, W=360, H=210) ==================== -->
  <g transform="translate(600, 80)">
    <rect class="state-box" x="0" y="0" width="360" height="210" />
    <text class="state-title" x="180" y="28">State 2.0: Snapshot &amp; Backup</text>
    <text class="state-sub" x="180" y="48">Pre-Fault State Serialization</text>
    <line class="state-divider" x1="0" y1="58" x2="360" y2="58" />

    <text class="bullet-text" x="18" y="86">&bull; Deep copy clone to memory chaosBackup</text>
    <text class="bullet-text" x="18" y="108">&bull; Locks pool mutex (sync.RWMutex)</text>
    <text class="bullet-text" x="18" y="130">&bull; Captures active conns &amp; alive flags</text>

    <!-- Status Invariant Badge -->
    <g transform="translate(180, 172)">
      <rect class="status-pill-bg" x="-80" y="-11" width="160" height="22" />
      <text class="status-pill-text" x="0" y="4">Atomic Snapshot Taken</text>
    </g>
  </g>

  <!-- Connector: State 2.0 -> State 3.0 (Spans X=960 to X=1120, 160px clear gap) -->
  <path class="conn-solid" d="M 960 185 L 1120 185" marker-end="url(#arrow)" />
  <g transform="translate(1040, 185)">
    <rect class="badge-bg" x="-52" y="-11" width="104" height="22" />
    <text class="badge-text" x="0" y="4">Launch Workers</text>
  </g>


  <!-- ==================== STATE 3.0: ATTACK WAVE EXECUTION (X=1120, Y=80, W=360, H=210) ==================== -->
  <g transform="translate(1120, 80)">
    <rect class="state-box" x="0" y="0" width="360" height="210" />
    <text class="state-title" x="180" y="28">State 3.0: Attack Wave Execution</text>
    <text class="state-sub" x="180" y="48">Synthetic Stress &amp; Fault Injection</text>
    <line class="state-divider" x1="0" y1="58" x2="360" y2="58" />

    <text class="bullet-text" x="18" y="86">&bull; 64 Goroutine workers dispatch requests</text>
    <text class="bullet-text" x="18" y="108">&bull; Poisson-jittered failure vector arrival</text>
    <text class="bullet-text" x="18" y="130">&bull; Targets DoS, latency, outage &amp; bursts</text>

    <!-- Status Invariant Badge -->
    <g transform="translate(180, 172)">
      <rect class="status-pill-bg" x="-68" y="-11" width="136" height="22" />
      <text class="status-pill-text" x="0" y="4">64 Workers Active</text>
    </g>
  </g>


  <!-- ==================== STATE 4.0: ATOMIC ROLLBACK (X=560, Y=480, W=440, H=210) ==================== -->
  <g transform="translate(560, 480)">
    <rect class="state-box" x="0" y="0" width="440" height="210" />
    <text class="state-title" x="220" y="28">State 4.0: Atomic Rollback &amp; Recovery</text>
    <text class="state-sub" x="220" y="48">Post-Attack Restorative Convergence</text>
    <line class="state-divider" x1="0" y1="58" x2="440" y2="58" />

    <text class="bullet-text" x="18" y="86">&bull; Executes restoreChaos() lock-guarded routine</text>
    <text class="bullet-text" x="18" y="108">&bull; Flushes artificial delays &amp; clears error flags</text>
    <text class="bullet-text" x="18" y="130">&bull; Atomically reapplies pre-fault baseline state</text>

    <!-- Status Invariant Badge -->
    <g transform="translate(220, 172)">
      <rect class="status-pill-bg" x="-80" y="-11" width="160" height="22" />
      <text class="status-pill-text" x="0" y="4">Full Recovery Verified</text>
    </g>
  </g>


  <!-- ==================== SYMMETRICAL RETURN LOOP CONNECTORS ==================== -->
  <!-- State 3.0 -> State 4.0 -->
  <!-- Drops from bottom center of State 3.0 (X=1300, Y=290) to Y=585, then left into State 4.0 (X=1000) -->
  <path class="conn-solid" d="M 1300 290 L 1300 585 L 1000 585" marker-end="url(#arrow)" />
  <g transform="translate(1150, 585)">
    <rect class="badge-bg" x="-90" y="-11" width="180" height="22" />
    <text class="badge-text" x="0" y="4">Duration Elapsed / Stop Wave</text>
  </g>

  <!-- State 4.0 -> State 1.0 -->
  <!-- Exits left of State 4.0 (X=560, Y=585) horizontally to X=260, then straight up into State 1.0 (Y=290) -->
  <path class="conn-solid" d="M 560 585 L 260 585 L 260 290" marker-end="url(#arrow)" />
  <g transform="translate(410, 585)">
    <rect class="badge-bg" x="-85" y="-11" width="170" height="22" />
    <text class="badge-text" x="0" y="4">Atomic Cluster Restoration</text>
  </g>

</svg>
</div>
</body>
</html>
