<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: #FFFFFF;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px;
  }
  .canvas {
    width: 1560px;
    height: 1180px;
    background: #FFFFFF;
    position: relative;
  }
  svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  /* Structural Phase Boxes (Top & Bottom) */
  .phase-box {
    fill: #FFFFFF;
    stroke: #0F172A;
    stroke-width: 2px;
    rx: 6px;
    filter: drop-shadow(0 2px 5px rgba(15,23,42,0.06));
  }
  .phase-accent {
    fill: #0F172A;
    rx: 4px;
  }

  /* Sprint Cards */
  .sprint-card {
    fill: #FFFFFF;
    stroke: #334155;
    stroke-width: 1.8px;
    rx: 6px;
    filter: drop-shadow(0 1px 4px rgba(51,65,85,0.06));
  }

  /* Gate Diamonds */
  .gate-poly {
    fill: #FFFFFF;
    stroke: #0F172A;
    stroke-width: 2px;
    filter: drop-shadow(0 2px 6px rgba(15,23,42,0.08));
  }

  /* Typography */
  .title-main {
    font-size: 15.5px;
    font-weight: 700;
    fill: #0F172A;
  }
  .title-sub {
    font-size: 12.5px;
    font-weight: 500;
    fill: #475569;
  }
  .gate-title {
    font-size: 14px;
    font-weight: 700;
    fill: #0F172A;
    text-anchor: middle;
  }
  .gate-sub {
    font-size: 12px;
    font-weight: 500;
    fill: #475569;
    text-anchor: middle;
  }

  /* Connectors */
  .conn-forward {
    fill: none;
    stroke: #0F172A;
    stroke-width: 2.4px;
  }
  .conn-feedback {
    fill: none;
    stroke: #991B1B;
    stroke-width: 2.2px;
    stroke-dasharray: 6,4;
  }

  /* Labels */
  .pill-green {
    fill: #FFFFFF;
    stroke: #166534;
    stroke-width: 1.5px;
    rx: 5px;
    filter: drop-shadow(0 1px 3px rgba(22,101,52,0.1));
  }
  .text-green {
    font-size: 12.5px;
    font-weight: 700;
    fill: #166534;
    text-anchor: middle;
  }
  .pill-red {
    fill: #FFFFFF;
    stroke: #991B1B;
    stroke-width: 1.5px;
    rx: 5px;
    filter: drop-shadow(0 1px 3px rgba(153,27,27,0.1));
  }
  .text-red {
    font-size: 12.5px;
    font-weight: 700;
    fill: #991B1B;
    text-anchor: middle;
  }
</style>
</head>
<body>
<div class="canvas">
<svg viewBox="0 0 1560 1180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0F172A" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#991B1B" />
    </marker>
  </defs>

  <!-- ==================== PHASES 1 & 2 (CENTERED AT X = 780) ==================== -->
  <!-- Phase 1: Requirements Analysis -->
  <g transform="translate(520, 35)">
    <rect class="phase-box" x="0" y="0" width="520" height="74" />
    <rect class="phase-accent" x="0" y="0" width="6" height="74" />
    <text class="title-main" x="260" y="32" text-anchor="middle">Phase 1: Requirements Analysis</text>
    <text class="title-sub" x="260" y="54" text-anchor="middle">Protocol Standards, Latency Targets & Concurrency Budgets</text>
  </g>

  <!-- Phase 2: Architectural Design -->
  <g transform="translate(520, 145)">
    <rect class="phase-box" x="0" y="0" width="520" height="74" />
    <rect class="phase-accent" x="0" y="0" width="6" height="74" />
    <text class="title-main" x="260" y="32" text-anchor="middle">Phase 2: Architectural Design</text>
    <text class="title-sub" x="260" y="54" text-anchor="middle">Layered Pipelines, Subsystem Interfaces & Memory Models</text>
  </g>

  <!-- Connector: Phase 1 -> Phase 2 -->
  <path class="conn-forward" d="M 780 109 L 780 145" marker-end="url(#arrow-dark)" />

  <!-- Connector: Phase 2 -> Sprint 1 (Clean corridor, zero box overlap) -->
  <path class="conn-forward" d="M 550 219 L 550 255 L 365 255 L 365 310" marker-end="url(#arrow-dark)" />

  <!-- ==================== COLUMN 1: SPRINTS 1-4 & QUALITY GATE 1 ==================== -->
  <!-- Sprint 1 (X=180 to 550, Center X=365) -->
  <g transform="translate(180, 310)">
    <rect class="sprint-card" x="0" y="0" width="370" height="72" />
    <text class="title-main" x="185" y="31" text-anchor="middle">Sprint 1: Ingress Proxy Core</text>
    <text class="title-sub" x="185" y="52" text-anchor="middle">ReverseProxy, Buffer Reuse & Ingress Port :8080</text>
  </g>

  <!-- Sprint 2 -->
  <g transform="translate(180, 420)">
    <rect class="sprint-card" x="0" y="0" width="370" height="72" />
    <text class="title-main" x="185" y="31" text-anchor="middle">Sprint 2: Baseline Balancer Engine</text>
    <text class="title-sub" x="185" y="52" text-anchor="middle">Balancer Interface, Round-Robin, LeastConn, IP Hash</text>
  </g>

  <!-- Sprint 3 -->
  <g transform="translate(180, 530)">
    <rect class="sprint-card" x="0" y="0" width="370" height="72" />
    <text class="title-main" x="185" y="31" text-anchor="middle">Sprint 3: Dual-Mode Health Checking</text>
    <text class="title-sub" x="185" y="52" text-anchor="middle">Proactive 3s Polling & Reactive Socket Interception</text>
  </g>

  <!-- Sprint 4 -->
  <g transform="translate(180, 640)">
    <rect class="sprint-card" x="0" y="0" width="370" height="72" />
    <text class="title-main" x="185" y="31" text-anchor="middle">Sprint 4: Prototype Telemetry</text>
    <text class="title-sub" x="185" y="52" text-anchor="middle">1 Hz SSE Broadcast & Single-Binary embed.FS</text>
  </g>

  <!-- Quality Gate 1 (Diamond: center at X=365, Y=800, W=260, H=80) -->
  <g transform="translate(235, 760)">
    <polygon class="gate-poly" points="130,0 260,40 130,80 0,40" />
    <text class="gate-title" x="130" y="36">Quality Gate 1</text>
    <text class="gate-sub" x="130" y="54">go test -race Clean?</text>
  </g>

  <!-- Column 1 Sequential Connectors -->
  <path class="conn-forward" d="M 365 382 L 365 420" marker-end="url(#arrow-dark)" />
  <path class="conn-forward" d="M 365 492 L 365 530" marker-end="url(#arrow-dark)" />
  <path class="conn-forward" d="M 365 602 L 365 640" marker-end="url(#arrow-dark)" />
  <path class="conn-forward" d="M 365 712 L 365 760" marker-end="url(#arrow-dark)" />

  <!-- ==================== COLUMN 2: SPRINTS 5-8 & GATE 2 ==================== -->
  <!-- Sprint 5 (X=730 to 1100, Center X=915) -->
  <g transform="translate(730, 310)">
    <rect class="sprint-card" x="0" y="0" width="370" height="72" />
    <text class="title-main" x="185" y="31" text-anchor="middle">Sprint 5: SWRR & Canary Steering</text>
    <text class="title-sub" x="185" y="52" text-anchor="middle">NGINX Smooth Weighted RR & L7 Tag Routing</text>
  </g>

  <!-- Sprint 6 -->
  <g transform="translate(730, 420)">
    <rect class="sprint-card" x="0" y="0" width="370" height="72" />
    <text class="title-main" x="185" y="31" text-anchor="middle">Sprint 6: Edge Shield & Circuit Breaker</text>
    <text class="title-sub" x="185" y="52" text-anchor="middle">Per-IP Token Bucket (429) & 3-State Outlier Detection</text>
  </g>

  <!-- Sprint 7 -->
  <g transform="translate(730, 530)">
    <rect class="sprint-card" x="0" y="0" width="370" height="72" />
    <text class="title-main" x="185" y="31" text-anchor="middle">Sprint 7: Staged Retry & Smart Auto</text>
    <text class="title-sub" x="185" y="52" text-anchor="middle">retryRecorder Replay & 4-Tier Adaptive Meta-Balancer</text>
  </g>

  <!-- Sprint 8 -->
  <g transform="translate(730, 640)">
    <rect class="sprint-card" x="0" y="0" width="370" height="72" />
    <text class="title-main" x="185" y="31" text-anchor="middle">Sprint 8: Chaos Simulator & Data-Terminal</text>
    <text class="title-sub" x="185" y="52" text-anchor="middle">64-Worker Chaos Studio, Rollback & Dark 4-View UI</text>
  </g>

  <!-- Chaos & Production Gate (Diamond: center at X=915, Y=800, W=260, H=80) -->
  <g transform="translate(785, 760)">
    <polygon class="gate-poly" points="130,0 260,40 130,80 0,40" />
    <text class="gate-title" x="130" y="36">Chaos & Production Gate</text>
    <text class="gate-sub" x="130" y="54">Zero Flapping & 0 Drops?</text>
  </g>

  <!-- Column 2 Sequential Connectors -->
  <path class="conn-forward" d="M 915 382 L 915 420" marker-end="url(#arrow-dark)" />
  <path class="conn-forward" d="M 915 492 L 915 530" marker-end="url(#arrow-dark)" />
  <path class="conn-forward" d="M 915 602 L 915 640" marker-end="url(#arrow-dark)" />
  <path class="conn-forward" d="M 915 712 L 915 760" marker-end="url(#arrow-dark)" />

  <!-- ==================== PHASE 5 (BOTTOM) ==================== -->
  <g transform="translate(655, 1030)">
    <rect class="phase-box" x="0" y="0" width="520" height="74" />
    <rect class="phase-accent" x="0" y="0" width="6" height="74" />
    <text class="title-main" x="260" y="32" text-anchor="middle">Phase 5: Evaluation & Milestone Delivery</text>
    <text class="title-sub" x="260" y="54" text-anchor="middle">1,500 RPS Stress Benchmark, Race Freedom & Academic Release</text>
  </g>

  <!-- Connector: Gate 2 [Yes] -> Phase 5 -->
  <path class="conn-forward" d="M 915 840 L 915 1030" marker-end="url(#arrow-dark)" />
  <rect class="pill-green" x="890" y="920" width="50" height="28" />
  <text class="text-green" x="915" y="939">Yes</text>

  <!-- ==================== INTER-COLUMN TRANSITION (GATE 1 -> SPRINT 5) ==================== -->
  <!-- Clean central highway along X=640 -->
  <path class="conn-forward" d="M 495 800 L 640 800 L 640 346 L 730 346" marker-end="url(#arrow-dark)" />
  <rect class="pill-green" x="525" y="786" width="95" height="28" />
  <text class="text-green" x="572" y="805">Yes (Clean)</text>

  <!-- ==================== FEEDBACK LOOPS (CRIMSON DASHED) ==================== -->
  <!-- LOOP 1: Gate 1 [No] -> Sprint 2 (Track X=70) -->
  <path class="conn-feedback" d="M 235 800 L 70 800 L 70 456 L 180 456" marker-end="url(#arrow-red)" />
  <rect class="pill-red" x="135" y="786" width="45" height="28" />
  <text class="text-red" x="157" y="805">No</text>

  <!-- Refactor Sprint Label (Horizontal, generous padding, zero line overlap) -->
  <rect class="pill-red" x="10" y="590" width="120" height="30" />
  <text class="text-red" x="70" y="610">Refactor Sprint</text>

  <!-- LOOP 2: Gate 2 [No] -> Sprint 6 (Track X=1220) -->
  <path class="conn-feedback" d="M 1045 800 L 1220 800 L 1220 456 L 1100 456" marker-end="url(#arrow-red)" />
  <rect class="pill-red" x="1105" y="786" width="45" height="28" />
  <text class="text-red" x="1127" y="805">No</text>

  <!-- Tuning Iteration Label (Horizontal, generous padding, zero line overlap) -->
  <rect class="pill-red" x="1155" y="560" width="130" height="30" />
  <text class="text-red" x="1220" y="580">Tuning Iteration</text>

  <!-- LOOP 3: Phase 5 Retrospective -> Phase 2 (Track X=1410) -->
  <path class="conn-feedback" d="M 1175 1067 L 1410 1067 L 1410 182 L 1040 182" marker-end="url(#arrow-red)" />
  <!-- Post-Sprint Retrospective Label (Horizontal, staggered at Y=680, generous padding) -->
  <rect class="pill-red" x="1310" y="680" width="200" height="32" />
  <text class="text-red" x="1410" y="701">Post-Sprint Retrospective</text>

</svg>
</div>
</body>
</html>
