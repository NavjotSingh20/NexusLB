<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: #FFFFFF;
    font-family: "Latin Modern Roman", "Computer Modern", "Times New Roman", Times, serif;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 100%;
  }
  .canvas {
    width: 1520px;
    height: 1060px;
    background: #FFFFFF;
    position: relative;
  }
  svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  /* Structural Phase Boxes (Top & Bottom) */
  .phase-box {
    fill: #FFFFFF;
    stroke: #000000;
    stroke-width: 1.8px;
    rx: 4px;
  }

  /* Sprint Cards */
  .sprint-card {
    fill: #FFFFFF;
    stroke: #000000;
    stroke-width: 1.6px;
    rx: 4px;
  }

  /* Gate Diamonds */
  .gate-poly {
    fill: #FFFFFF;
    stroke: #000000;
    stroke-width: 1.8px;
  }

  /* Typography */
  .title-main {
    font-size: 15px;
    font-weight: bold;
    fill: #000000;
    text-anchor: middle;
  }
  .title-sub {
    font-size: 12px;
    font-weight: normal;
    fill: #111111;
    text-anchor: middle;
  }
  .gate-title {
    font-size: 13.5px;
    font-weight: bold;
    fill: #000000;
    text-anchor: middle;
  }
  .gate-sub {
    font-size: 11.5px;
    font-weight: normal;
    font-style: italic;
    fill: #111111;
    text-anchor: middle;
  }

  /* Connectors */
  .conn-forward {
    fill: none;
    stroke: #000000;
    stroke-width: 1.8px;
  }
  .conn-feedback {
    fill: none;
    stroke: #000000;
    stroke-width: 1.8px;
    stroke-dasharray: 6,4;
  }

  /* Labels & Badges */
  .badge-bg {
    fill: #FFFFFF;
    stroke: #000000;
    stroke-width: 1px;
    rx: 3px;
  }
  .badge-text {
    font-size: 11.5px;
    font-weight: bold;
    fill: #000000;
    text-anchor: middle;
  }
  .gate-label-text {
    font-size: 11px;
    font-weight: bold;
    fill: #000000;
    text-anchor: middle;
  }
</style>
</head>
<body>
<div class="canvas">
<svg viewBox="0 0 1520 1060" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#000000" />
    </marker>
  </defs>

  <!-- ==================== PHASES 1 & 2 (CENTERED AT X = 760) ==================== -->
  <!-- Phase 1: Requirements Analysis -->
  <g transform="translate(500, 30)">
    <rect class="phase-box" x="0" y="0" width="520" height="70" />
    <text class="title-main" x="260" y="30">Phase 1: Requirements Analysis</text>
    <text class="title-sub" x="260" y="52">Protocol Standards, Latency Targets &amp; Concurrency Budgets</text>
  </g>

  <!-- Phase 2: Architectural Design -->
  <g transform="translate(500, 140)">
    <rect class="phase-box" x="0" y="0" width="520" height="70" />
    <text class="title-main" x="260" y="30">Phase 2: Architectural Design</text>
    <text class="title-sub" x="260" y="52">Layered Pipelines, Subsystem Interfaces &amp; Memory Models</text>
  </g>

  <!-- Connector: Phase 1 -> Phase 2 -->
  <path class="conn-forward" d="M 760 100 L 760 140" marker-end="url(#arrow)" />

  <!-- Connector: Phase 2 -> Sprint 1 (Clean corridor, zero box overlap) -->
  <path class="conn-forward" d="M 530 210 L 530 250 L 365 250 L 365 300" marker-end="url(#arrow)" />

  <!-- ==================== COLUMN 1: SPRINTS 1-4 & QUALITY GATE 1 ==================== -->
  <!-- Sprint 1 (X=180 to 550, Center X=365) -->
  <g transform="translate(180, 300)">
    <rect class="sprint-card" x="0" y="0" width="370" height="68" />
    <text class="title-main" x="185" y="29">Sprint 1: Ingress Proxy Core</text>
    <text class="title-sub" x="185" y="50">ReverseProxy, Buffer Reuse &amp; Ingress Port :8080</text>
  </g>

  <!-- Sprint 2 -->
  <g transform="translate(180, 400)">
    <rect class="sprint-card" x="0" y="0" width="370" height="68" />
    <text class="title-main" x="185" y="29">Sprint 2: Baseline Balancer Engine</text>
    <text class="title-sub" x="185" y="50">Balancer Interface, Round-Robin, LeastConn, IP Hash</text>
  </g>

  <!-- Sprint 3 -->
  <g transform="translate(180, 500)">
    <rect class="sprint-card" x="0" y="0" width="370" height="68" />
    <text class="title-main" x="185" y="29">Sprint 3: Dual-Mode Health Checking</text>
    <text class="title-sub" x="185" y="50">Proactive 3s Polling &amp; Reactive Socket Interception</text>
  </g>

  <!-- Sprint 4 -->
  <g transform="translate(180, 600)">
    <rect class="sprint-card" x="0" y="0" width="370" height="68" />
    <text class="title-main" x="185" y="29">Sprint 4: Prototype Telemetry</text>
    <text class="title-sub" x="185" y="50">1 Hz SSE Broadcast &amp; Single-Binary embed.FS</text>
  </g>

  <!-- Forward Connectors Column 1 -->
  <path class="conn-forward" d="M 365 368 L 365 400" marker-end="url(#arrow)" />
  <path class="conn-forward" d="M 365 468 L 365 500" marker-end="url(#arrow)" />
  <path class="conn-forward" d="M 365 568 L 365 600" marker-end="url(#arrow)" />
  <path class="conn-forward" d="M 365 668 L 365 712" marker-end="url(#arrow)" />

  <!-- Quality Gate 1 Diamond (Center: 365, 750) -->
  <g>
    <polygon class="gate-poly" points="365,712 505,750 365,788 225,750" />
    <text class="gate-title" x="365" y="745">Quality Gate 1</text>
    <text class="gate-sub" x="365" y="763">go test -race Clean?</text>
  </g>

  <!-- Feedback Connector: Quality Gate 1 (No) -> Sprint 2 -->
  <path class="conn-feedback" d="M 225 750 L 90 750 L 90 434 L 180 434" marker-end="url(#arrow)" />
  <!-- Gate 1 No Badge -->
  <g transform="translate(145, 740)">
    <rect class="badge-bg" x="-18" y="-10" width="36" height="20" />
    <text class="gate-label-text" x="0" y="4">No</text>
  </g>
  <!-- Refactor Sprint Badge -->
  <g transform="translate(90, 560)">
    <rect class="badge-bg" x="-60" y="-12" width="120" height="24" />
    <text class="badge-text" x="0" y="4">Refactor Sprint</text>
  </g>

  <!-- Forward Connector: Quality Gate 1 (Yes Clean) -> Sprint 5 -->
  <path class="conn-forward" d="M 505 750 L 685 750 L 685 334 L 810 334" marker-end="url(#arrow)" />
  <!-- Gate 1 Yes Badge -->
  <g transform="translate(565, 750)">
    <rect class="badge-bg" x="-42" y="-11" width="84" height="22" />
    <text class="badge-text" x="0" y="4">Yes (Clean)</text>
  </g>

  <!-- ==================== COLUMN 2: SPRINTS 5-8 & CHAOS GATE ==================== -->
  <!-- Sprint 5 (X=810 to 1180, Center X=995) -->
  <g transform="translate(810, 300)">
    <rect class="sprint-card" x="0" y="0" width="370" height="68" />
    <text class="title-main" x="185" y="29">Sprint 5: SWRR &amp; Canary Steering</text>
    <text class="title-sub" x="185" y="50">NGINX Smooth Weighted RR &amp; L7 Tag Routing</text>
  </g>

  <!-- Sprint 6 -->
  <g transform="translate(810, 400)">
    <rect class="sprint-card" x="0" y="0" width="370" height="68" />
    <text class="title-main" x="185" y="29">Sprint 6: Edge Shield &amp; Circuit Breaker</text>
    <text class="title-sub" x="185" y="50">Per-IP Token Bucket (429) &amp; 3-State Outlier Detection</text>
  </g>

  <!-- Sprint 7 -->
  <g transform="translate(810, 500)">
    <rect class="sprint-card" x="0" y="0" width="370" height="68" />
    <text class="title-main" x="185" y="29">Sprint 7: Staged Retry &amp; Smart Auto</text>
    <text class="title-sub" x="185" y="50">retryRecorder Replay &amp; 4-Tier Adaptive Meta-Balancer</text>
  </g>

  <!-- Sprint 8 -->
  <g transform="translate(810, 600)">
    <rect class="sprint-card" x="0" y="0" width="370" height="68" />
    <text class="title-main" x="185" y="29">Sprint 8: Chaos Simulator &amp; Data-Terminal</text>
    <text class="title-sub" x="185" y="50">64-Worker Chaos Studio, Rollback &amp; Dark 4-View UI</text>
  </g>

  <!-- Forward Connectors Column 2 -->
  <path class="conn-forward" d="M 995 368 L 995 400" marker-end="url(#arrow)" />
  <path class="conn-forward" d="M 995 468 L 995 500" marker-end="url(#arrow)" />
  <path class="conn-forward" d="M 995 568 L 995 600" marker-end="url(#arrow)" />
  <path class="conn-forward" d="M 995 668 L 995 712" marker-end="url(#arrow)" />

  <!-- Chaos & Production Gate Diamond (Center: 995, 750) -->
  <g>
    <polygon class="gate-poly" points="995,712 1135,750 995,788 855,750" />
    <text class="gate-title" x="995" y="745">Chaos &amp; Production Gate</text>
    <text class="gate-sub" x="995" y="763">Zero Flapping &amp; 0 Drops?</text>
  </g>

  <!-- Feedback Connector: Chaos Gate (No) -> Sprint 6 -->
  <path class="conn-feedback" d="M 1135 750 L 1270 750 L 1270 434 L 1180 434" marker-end="url(#arrow)" />
  <!-- Gate 2 No Badge -->
  <g transform="translate(1175, 740)">
    <rect class="badge-bg" x="-18" y="-10" width="36" height="20" />
    <text class="gate-label-text" x="0" y="4">No</text>
  </g>
  <!-- Tuning Iteration Badge -->
  <g transform="translate(1270, 560)">
    <rect class="badge-bg" x="-60" y="-12" width="120" height="24" />
    <text class="badge-text" x="0" y="4">Tuning Iteration</text>
  </g>

  <!-- Forward Connector: Chaos Gate (Yes) -> Phase 5 -->
  <path class="conn-forward" d="M 995 788 L 995 910" marker-end="url(#arrow)" />
  <!-- Gate 2 Yes Badge -->
  <g transform="translate(995, 845)">
    <rect class="badge-bg" x="-22" y="-11" width="44" height="22" />
    <text class="badge-text" x="0" y="4">Yes</text>
  </g>

  <!-- ==================== PHASE 5: EVALUATION & MILESTONE DELIVERY ==================== -->
  <g transform="translate(500, 910)">
    <rect class="phase-box" x="0" y="0" width="520" height="70" />
    <text class="title-main" x="260" y="30">Phase 5: Evaluation &amp; Milestone Delivery</text>
    <text class="title-sub" x="260" y="52">1,500 RPS Stress Benchmark, Race Freedom &amp; Academic Release</text>
  </g>

  <!-- Feedback Connector: Phase 5 -> Phase 2 (Outer Track X=1420) -->
  <path class="conn-feedback" d="M 1020 945 L 1420 945 L 1420 175 L 1020 175" marker-end="url(#arrow)" />
  <!-- Post-Sprint Retrospective Badge -->
  <g transform="translate(1420, 560)">
    <rect class="badge-bg" x="-85" y="-12" width="170" height="24" />
    <text class="badge-text" x="0" y="4">Post-Sprint Retrospective</text>
  </g>

</svg>
</div>
</body>
</html>
