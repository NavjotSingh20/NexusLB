<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: #FFFFFF;
    font-family: "Latin Modern Roman", "Computer Modern", "Times New Roman", Times, serif;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 100%;
  }
  .canvas {
    width: 1520px;
    height: 980px;
    background: #FFFFFF;
    position: relative;
  }
  svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  /* Section Dividers */
  .section-label {
    font-size: 14.5px;
    font-weight: bold;
    fill: #000000;
    letter-spacing: 0.5px;
  }
  .section-rule {
    stroke: #000000;
    stroke-width: 1.2px;
  }

  /* External Entities */
  .entity-box {
    fill: #FFFFFF;
    stroke: #000000;
    stroke-width: 1.8px;
    rx: 4px;
  }
  .entity-title {
    font-size: 14.5px;
    font-weight: bold;
    fill: #000000;
    text-anchor: middle;
  }
  .entity-sub {
    font-size: 11.5px;
    font-weight: normal;
    fill: #111111;
    text-anchor: middle;
  }

  /* Process Bubbles */
  .process-bubble {
    fill: #FFFFFF;
    stroke: #000000;
    stroke-width: 1.8px;
  }
  .process-divider {
    stroke: #000000;
    stroke-width: 1px;
  }
  .process-id {
    font-size: 12px;
    font-weight: bold;
    fill: #000000;
    text-anchor: middle;
  }
  .process-title {
    font-size: 14px;
    font-weight: bold;
    fill: #000000;
    text-anchor: middle;
  }
  .process-desc {
    font-size: 11.5px;
    font-weight: normal;
    fill: #111111;
    text-anchor: middle;
  }
  .process-subdesc {
    font-size: 10.5px;
    font-weight: normal;
    font-style: italic;
    fill: #333333;
    text-anchor: middle;
  }

  /* Data Store Boxes (Gane & Sarson DFD notation) */
  .store-box {
    fill: #FFFFFF;
    stroke: #000000;
    stroke-width: 1.6px;
    rx: 2px;
  }
  .store-divider {
    stroke: #000000;
    stroke-width: 1.4px;
  }
  .store-id {
    font-size: 13.5px;
    font-weight: bold;
    fill: #000000;
    text-anchor: middle;
  }
  .store-title {
    font-size: 13px;
    font-weight: bold;
    fill: #000000;
    text-anchor: start;
  }
  .store-sub {
    font-size: 11px;
    font-weight: normal;
    fill: #222222;
    text-anchor: start;
  }

  /* Flow Connectors */
  .conn-flow {
    fill: none;
    stroke: #000000;
    stroke-width: 1.6px;
  }
  .conn-dash {
    fill: none;
    stroke: #000000;
    stroke-width: 1.6px;
    stroke-dasharray: 6,4;
  }

  /* Badges & Labels */
  .badge-bg {
    fill: #FFFFFF;
    stroke: #000000;
    stroke-width: 1px;
    rx: 3px;
  }
  .badge-text {
    font-size: 11px;
    font-weight: bold;
    fill: #000000;
    text-anchor: middle;
  }
</style>
</head>
<body>
<div class="canvas">
<svg viewBox="0 0 1520 980" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#000000" />
    </marker>
  </defs>

  <!-- ==================== DFD LEVEL 0: CONTEXT BOUNDARY ==================== -->
  <text class="section-label" x="40" y="32">DFD LEVEL 0: CONTEXT BOUNDARY</text>
  <line class="section-rule" x1="40" y1="42" x2="1480" y2="42" />

  <!-- External Entity 1: External Client (X=60, Y=80, W=240, H=84) -->
  <g transform="translate(60, 80)">
    <rect class="entity-box" x="0" y="0" width="240" height="84" />
    <text class="entity-title" x="120" y="36">External Client</text>
    <text class="entity-sub" x="120" y="58">Web / Mobile / API Consumer</text>
  </g>

  <!-- Process 0.0: NexusLB Gateway (Center X=760, Center Y=122, rx=135, ry=72) -->
  <g transform="translate(760, 122)">
    <ellipse class="process-bubble" cx="0" cy="0" rx="135" ry="72" />
    <line class="process-divider" x1="-115" y1="-22" x2="115" y2="-22" />
    <text class="process-id" x="0" y="-32">Process 0.0</text>
    <text class="process-title" x="0" y="4">NexusLB Gateway</text>
    <text class="process-desc" x="0" y="24">Unified Reverse Proxy &amp; Ingress Core</text>
    <text class="process-subdesc" x="0" y="42">Data Plane &amp; Administrative Management</text>
  </g>

  <!-- External Entity 2: Upstream Pool (X=1220, Y=80, W=240, H=84) -->
  <g transform="translate(1220, 80)">
    <rect class="entity-box" x="0" y="0" width="240" height="84" />
    <text class="entity-title" x="120" y="36">Upstream Server Pool</text>
    <text class="entity-sub" x="120" y="58">Backend Nodes :8001, :8002, :8003</text>
  </g>

  <!-- External Entity 3: DevOps / SRE Admin (X=640, Y=280, W=240, H=80) -->
  <g transform="translate(640, 280)">
    <rect class="entity-box" x="0" y="0" width="240" height="80" />
    <text class="entity-title" x="120" y="34">DevOps / SRE Administrator</text>
    <text class="entity-sub" x="120" y="56">Console Dashboard &amp; REST API (:8081)</text>
  </g>

  <!-- Connectors: Client <-> Process 0.0 -->
  <!-- Top: Client -> Gateway (HTTP Ingress Request) -->
  <path class="conn-flow" d="M 300 102 L 625 102" marker-end="url(#arrow)" />
  <g transform="translate(462, 102)">
    <rect class="badge-bg" x="-95" y="-11" width="190" height="22" />
    <text class="badge-text" x="0" y="4">HTTP Ingress Request (:8080)</text>
  </g>

  <!-- Bottom: Gateway -> Client (HTTP Response) -->
  <path class="conn-flow" d="M 625 142 L 300 142" marker-end="url(#arrow)" />
  <g transform="translate(462, 142)">
    <rect class="badge-bg" x="-105" y="-11" width="210" height="22" />
    <text class="badge-text" x="0" y="4">HTTP Response (200 OK / 429 / 502)</text>
  </g>

  <!-- Connectors: Process 0.0 <-> Upstream Pool -->
  <!-- Top: Gateway -> Upstream (Forward Proxy Request) -->
  <path class="conn-flow" d="M 895 102 L 1220 102" marker-end="url(#arrow)" />
  <g transform="translate(1057, 102)">
    <rect class="badge-bg" x="-75" y="-11" width="150" height="22" />
    <text class="badge-text" x="0" y="4">Forward Proxy Request</text>
  </g>

  <!-- Bottom: Upstream -> Gateway (Upstream Response) -->
  <path class="conn-flow" d="M 1220 142 L 895 142" marker-end="url(#arrow)" />
  <g transform="translate(1057, 142)">
    <rect class="badge-bg" x="-80" y="-11" width="160" height="22" />
    <text class="badge-text" x="0" y="4">Upstream Node Response</text>
  </g>

  <!-- Connectors: Process 0.0 <-> DevOps Admin (Vertical gap Y=194 to Y=280) -->
  <!-- Admin -> Gateway (Upward at X=715) -->
  <path class="conn-flow" d="M 715 280 L 715 194" marker-end="url(#arrow)" />
  <g transform="translate(615, 237)">
    <rect class="badge-bg" x="-80" y="-11" width="160" height="22" />
    <text class="badge-text" x="0" y="4">Policy Config &amp; Swaps</text>
  </g>

  <!-- Gateway -> Admin (Downward at X=805) -->
  <path class="conn-flow" d="M 805 194 L 805 280" marker-end="url(#arrow)" />
  <g transform="translate(905, 237)">
    <rect class="badge-bg" x="-85" y="-11" width="170" height="22" />
    <text class="badge-text" x="0" y="4">1 Hz SSE Telemetry Feed</text>
  </g>


  <!-- ==================== DFD LEVEL 1: FUNCTIONAL DECOMPOSITION & DATA STORES ==================== -->
  <text class="section-label" x="40" y="415">DFD LEVEL 1: FUNCTIONAL DECOMPOSITION &amp; DATA STORES</text>
  <line class="section-rule" x1="40" y1="425" x2="1480" y2="425" />

  <!-- Process 1.0 (Center X=230, Center Y=580, rx=88, ry=64) -->
  <g transform="translate(230, 580)">
    <ellipse class="process-bubble" cx="0" cy="0" rx="88" ry="64" />
    <line class="process-divider" x1="-75" y1="-20" x2="75" y2="-20" />
    <text class="process-id" x="0" y="-30">Process 1.0</text>
    <text class="process-title" x="0" y="2">Rate Policing</text>
    <text class="process-desc" x="0" y="21">Edge Shield Limiter</text>
    <text class="process-subdesc" x="0" y="38">Token Bucket Algorithm</text>
  </g>

  <!-- Process 2.0 (Center X=580, Center Y=580, rx=88, ry=64) -->
  <g transform="translate(580, 580)">
    <ellipse class="process-bubble" cx="0" cy="0" rx="88" ry="64" />
    <line class="process-divider" x1="-75" y1="-20" x2="75" y2="-20" />
    <text class="process-id" x="0" y="-30">Process 2.0</text>
    <text class="process-title" x="0" y="2">Strategy Selector</text>
    <text class="process-desc" x="0" y="21">Load Balancing Engine</text>
    <text class="process-subdesc" x="0" y="38">RR / LC / IPHash / SWRR</text>
  </g>

  <!-- Process 3.0 (Center X=930, Center Y=580, rx=88, ry=64) -->
  <g transform="translate(930, 580)">
    <ellipse class="process-bubble" cx="0" cy="0" rx="88" ry="64" />
    <line class="process-divider" x1="-75" y1="-20" x2="75" y2="-20" />
    <text class="process-id" x="0" y="-30">Process 3.0</text>
    <text class="process-title" x="0" y="2">Circuit Breaker</text>
    <text class="process-desc" x="0" y="21">Health Guardian</text>
    <text class="process-subdesc" x="0" y="38">Closed / Open / Half-Open</text>
  </g>

  <!-- Process 4.0 (Center X=1280, Center Y=580, rx=88, ry=64) -->
  <g transform="translate(1280, 580)">
    <ellipse class="process-bubble" cx="0" cy="0" rx="88" ry="64" />
    <line class="process-divider" x1="-75" y1="-20" x2="75" y2="-20" />
    <text class="process-id" x="0" y="-30">Process 4.0</text>
    <text class="process-title" x="0" y="2">Staged Proxy</text>
    <text class="process-desc" x="0" y="21">Reverse Proxy Engine</text>
    <text class="process-subdesc" x="0" y="38">Retry Buffer &amp; Failover</text>
  </g>

  <!-- Main Pipeline Flows -->
  <!-- Ingress -> Process 1.0 (Enters from External Client at X=50) -->
  <path class="conn-flow" d="M 50 580 L 142 580" marker-end="url(#arrow)" />
  <g transform="translate(96, 580)">
    <rect class="badge-bg" x="-32" y="-11" width="64" height="22" />
    <text class="badge-text" x="0" y="4">Request</text>
  </g>

  <!-- Process 1.0 -> Process 2.0 -->
  <path class="conn-flow" d="M 318 580 L 492 580" marker-end="url(#arrow)" />
  <g transform="translate(405, 580)">
    <rect class="badge-bg" x="-36" y="-11" width="72" height="22" />
    <text class="badge-text" x="0" y="4">Token OK</text>
  </g>

  <!-- Process 2.0 -> Process 3.0 -->
  <path class="conn-flow" d="M 668 580 L 842 580" marker-end="url(#arrow)" />
  <g transform="translate(755, 580)">
    <rect class="badge-bg" x="-46" y="-11" width="92" height="22" />
    <text class="badge-text" x="0" y="4">Target Node</text>
  </g>

  <!-- Process 3.0 -> Process 4.0 -->
  <path class="conn-flow" d="M 1018 580 L 1192 580" marker-end="url(#arrow)" />
  <g transform="translate(1105, 580)">
    <rect class="badge-bg" x="-48" y="-11" width="96" height="22" />
    <text class="badge-text" x="0" y="4">Circuit Closed</text>
  </g>

  <!-- Process 4.0 -> Upstream Egress (Exits to Upstream Server Pool at X=1480) -->
  <path class="conn-flow" d="M 1368 580 L 1480 580" marker-end="url(#arrow)" />
  <g transform="translate(1424, 580)">
    <rect class="badge-bg" x="-36" y="-11" width="72" height="22" />
    <text class="badge-text" x="0" y="4">Upstream</text>
  </g>

  <!-- Egress & Feedback Flows (Above Pipeline) -->
  <!-- 429 Too Many Requests: Exits Process 1.0 apex (Y=516), goes to Y=475, and returns LEFT to External Client (X=50) -->
  <path class="conn-flow" d="M 230 516 L 230 475 L 50 475" marker-end="url(#arrow)" />
  <g transform="translate(140, 475)">
    <rect class="badge-bg" x="-75" y="-11" width="150" height="22" />
    <text class="badge-text" x="0" y="4">429 Too Many Requests</text>
  </g>

  <!-- Circuit Breaker Trip: Process 3.0 -> Process 2.0 (Dashed Re-Route Loop) -->
  <path class="conn-dash" d="M 930 516 L 930 475 L 580 475 L 580 516" marker-end="url(#arrow)" />
  <g transform="translate(755, 475)">
    <rect class="badge-bg" x="-115" y="-11" width="230" height="22" />
    <text class="badge-text" x="0" y="4">Trip Open: Fast-Fail / Alternate Node</text>
  </g>


  <!-- ==================== DATA STORES (D1 - D4) ==================== -->
  <!-- D1: Token Bucket Registry (Center X=230, Y=820, W=260, H=74, X=100 to 360) -->
  <g transform="translate(100, 820)">
    <rect class="store-box" x="0" y="0" width="260" height="74" />
    <line class="store-divider" x1="48" y1="0" x2="48" y2="74" />
    <text class="store-id" x="24" y="43">D1</text>
    <text class="store-title" x="62" y="32">Token Bucket Registry</text>
    <text class="store-sub" x="62" y="54">Per-IP Token State &amp; 60s GC Sweeper</text>
  </g>

  <!-- D2: Strategy State Table (Center X=580, Y=820, W=260, H=74, X=450 to 710) -->
  <g transform="translate(450, 820)">
    <rect class="store-box" x="0" y="0" width="260" height="74" />
    <line class="store-divider" x1="48" y1="0" x2="48" y2="74" />
    <text class="store-id" x="24" y="43">D2</text>
    <text class="store-title" x="62" y="32">Strategy State Table</text>
    <text class="store-sub" x="62" y="54">Weights, Canary Tags &amp; Active Conns</text>
  </g>

  <!-- D3: Circuit Breaker State Table (Center X=930, Y=820, W=260, H=74, X=800 to 1060) -->
  <g transform="translate(800, 820)">
    <rect class="store-box" x="0" y="0" width="260" height="74" />
    <line class="store-divider" x1="48" y1="0" x2="48" y2="74" />
    <text class="store-id" x="24" y="43">D3</text>
    <text class="store-title" x="62" y="32">Circuit Breaker State Table</text>
    <text class="store-sub" x="62" y="54">Consecutive Errors, State &amp; Timers</text>
  </g>

  <!-- D4: Metrics Ring Buffer (Center X=1280, Y=820, W=260, H=74, X=1150 to 1410) -->
  <g transform="translate(1150, 820)">
    <rect class="store-box" x="0" y="0" width="260" height="74" />
    <line class="store-divider" x1="48" y1="0" x2="48" y2="74" />
    <text class="store-id" x="24" y="43">D4</text>
    <text class="store-title" x="62" y="32">Metrics Ring Buffer</text>
    <text class="store-sub" x="62" y="54">24-pt History &amp; 1 Hz SSE Broadcast</text>
  </g>

  <!-- Connectors: Processes -> Data Stores (Vertical Gap Y=644 to Y=820) -->
  <!-- P1 <-> D1 -->
  <path class="conn-dash" d="M 230 644 L 230 820" marker-end="url(#arrow)" />
  <g transform="translate(230, 732)">
    <rect class="badge-bg" x="-62" y="-11" width="124" height="22" />
    <text class="badge-text" x="0" y="4">Query / Decrement</text>
  </g>

  <!-- P2 <-> D2 -->
  <path class="conn-dash" d="M 580 644 L 580 820" marker-end="url(#arrow)" />
  <g transform="translate(580, 732)">
    <rect class="badge-bg" x="-68" y="-11" width="136" height="22" />
    <text class="badge-text" x="0" y="4">Active Policy &amp; Conns</text>
  </g>

  <!-- P3 <-> D3 -->
  <path class="conn-dash" d="M 930 644 L 930 820" marker-end="url(#arrow)" />
  <g transform="translate(930, 732)">
    <rect class="badge-bg" x="-58" y="-11" width="116" height="22" />
    <text class="badge-text" x="0" y="4">Failure Counters</text>
  </g>

  <!-- P4 <-> D4 -->
  <path class="conn-dash" d="M 1280 644 L 1280 820" marker-end="url(#arrow)" />
  <g transform="translate(1280, 732)">
    <rect class="badge-bg" x="-54" y="-11" width="108" height="22" />
    <text class="badge-text" x="0" y="4">Append Latency</text>
  </g>

</svg>
</div>
</body>
</html>
