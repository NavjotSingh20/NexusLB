<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: #FFFFFF;
    font-family: "Latin Modern Roman", "Computer Modern", "Times New Roman", Times, serif;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 100%;
  }
  .canvas {
    width: 1560px;
    height: 1240px;
    background: #FFFFFF;
    position: relative;
  }
  svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  /* Structural Component Boxes (LaTeX TikZ Style) */
  .comp-box {
    fill: #FFFFFF;
    stroke: #000000;
    stroke-width: 1.6px;
    rx: 4px;
  }
  .subcomp-box {
    fill: #FFFFFF;
    stroke: #000000;
    stroke-width: 1.3px;
    rx: 3px;
  }
  .group-box {
    fill: #FFFFFF;
    stroke: #000000;
    stroke-width: 1.4px;
    stroke-dasharray: 6,4;
    rx: 4px;
  }

  /* Typography */
  .title-main {
    font-size: 14.5px;
    font-weight: bold;
    fill: #000000;
    text-anchor: middle;
  }
  .title-sub {
    font-size: 11.5px;
    fill: #333333;
    text-anchor: middle;
    font-style: italic;
  }
  .algo-title {
    font-size: 12.5px;
    font-weight: bold;
    fill: #000000;
    text-anchor: middle;
  }
  .algo-sub {
    font-size: 10.5px;
    fill: #444444;
    text-anchor: middle;
  }
  .plane-header {
    font-size: 13.5px;
    font-weight: bold;
    fill: #000000;
    text-anchor: middle;
    letter-spacing: 0.5px;
  }

  /* Connectors */
  .line-solid {
    fill: none;
    stroke: #000000;
    stroke-width: 1.5px;
  }
  .line-dash {
    fill: none;
    stroke: #000000;
    stroke-width: 1.4px;
    stroke-dasharray: 5,4;
  }

  /* Label Badges */
  .badge-rect {
    fill: #FFFFFF;
    stroke: #000000;
    stroke-width: 1px;
    rx: 3px;
  }
  .badge-text {
    font-size: 11px;
    font-weight: bold;
    fill: #000000;
    text-anchor: middle;
  }
</style>
</head>
<body>
<div class="canvas">
<svg viewBox="0 0 1560 1240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Sharp Black Arrowheads -->
    <marker id="arr-black" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
    </marker>
    <marker id="open-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8 5 L 1 8.5" fill="none" stroke="#000000" stroke-width="1.4" />
    </marker>
  </defs>

  <!-- ==================== PLANE BOUNDARIES & HEADERS ==================== -->
  <!-- Left Plane: Ingress Data Plane -->
  <rect class="group-box" x="30" y="20" width="710" height="1200" />
  <text class="plane-header" x="385" y="44">INGRESS DATA PLANE (PORT :8080)</text>

  <!-- Right Plane: Control & Observability Plane -->
  <rect class="group-box" x="820" y="20" width="710" height="1200" />
  <text class="plane-header" x="1175" y="44">CONTROL &amp; OBSERVABILITY PLANE (PORT :8081)</text>

  <!-- ==================== LEFT PLANE: INGRESS HOT-PATH PIPELINE (Center X = 385) ==================== -->
  <!-- 1. Client Ingress Tier -->
  <g transform="translate(145, 60)">
    <rect class="comp-box" x="0" y="0" width="480" height="60" />
    <text class="title-main" x="240" y="26">Client Ingress Tier</text>
    <text class="title-sub" x="240" y="45">HTTP/1.1 &amp; HTTP/2 External Web Clients / Automated Traffic</text>
  </g>

  <!-- Connector: Client -> Edge Shield with Port :8080 Badge -->
  <line class="line-solid" x1="385" y1="120" x2="385" y2="180" marker-end="url(#arr-black)" />
  <rect class="badge-rect" x="325" y="137" width="120" height="22" />
  <text class="badge-text" x="385" y="152">Ingress Port :8080</text>

  <!-- 2. Ingress Edge Shield Rate Limiter -->
  <g transform="translate(145, 180)">
    <rect class="comp-box" x="0" y="0" width="480" height="60" />
    <text class="title-main" x="240" y="26">Ingress Edge Shield Rate Limiter</text>
    <text class="title-sub" x="240" y="45">Per-IP Token Bucket Engine (HTTP 429 Rejection &amp; 60s GC Sweeper)</text>
  </g>

  <!-- Connector: Edge Shield -> Canary Classifier -->
  <line class="line-solid" x1="385" y1="240" x2="385" y2="290" marker-end="url(#arr-black)" />

  <!-- 3. Layer 7 Canary Tag Classifier -->
  <g transform="translate(145, 290)">
    <rect class="comp-box" x="0" y="0" width="480" height="60" />
    <text class="title-main" x="240" y="26">Layer 7 Canary Tag Classifier</text>
    <text class="title-sub" x="240" y="45">X-Canary Header, Session Cookie &amp; Query Routing</text>
  </g>

  <!-- Connector: Canary Classifier -> Strategy Manager -->
  <line class="line-solid" x1="385" y1="350" x2="385" y2="400" marker-end="url(#arr-black)" />

  <!-- 4. Strategy Manager (Routing Core) -->
  <g transform="translate(145, 400)">
    <rect class="comp-box" x="0" y="0" width="480" height="60" />
    <text class="title-main" x="240" y="26">Strategy Manager (Routing Core)</text>
    <text class="title-sub" x="240" y="45">Pluggable Balancer Interface &amp; Dynamic Policy Selection</text>
  </g>

  <!-- Connector: Strategy Manager -> 5 Algorithms Distribution Bus -->
  <line class="line-solid" x1="385" y1="460" x2="385" y2="485" />
  <line class="line-solid" x1="105" y1="485" x2="665" y2="485" />
  <line class="line-solid" x1="105" y1="485" x2="105" y2="520" marker-end="url(#arr-black)" />
  <line class="line-solid" x1="245" y1="485" x2="245" y2="520" marker-end="url(#arr-black)" />
  <line class="line-solid" x1="385" y1="485" x2="385" y2="520" marker-end="url(#arr-black)" />
  <line class="line-solid" x1="525" y1="485" x2="525" y2="520" marker-end="url(#arr-black)" />
  <line class="line-solid" x1="665" y1="485" x2="665" y2="520" marker-end="url(#arr-black)" />

  <!-- 5. Five Active Routing Algorithms (Sub-Panel) -->
  <g transform="translate(45, 520)">
    <rect class="subcomp-box" x="0" y="0" width="120" height="52" />
    <text class="algo-title" x="60" y="23">Round-Robin</text>
    <text class="algo-sub" x="60" y="40">Atomic Index</text>
  </g>

  <g transform="translate(185, 520)">
    <rect class="subcomp-box" x="0" y="0" width="120" height="52" />
    <text class="algo-title" x="60" y="23">LeastConn</text>
    <text class="algo-sub" x="60" y="40">Offset Tiebreak</text>
  </g>

  <g transform="translate(325, 520)">
    <rect class="subcomp-box" x="0" y="0" width="120" height="52" />
    <text class="algo-title" x="60" y="23">IP Hash</text>
    <text class="algo-sub" x="60" y="40">Port Sanitation</text>
  </g>

  <g transform="translate(465, 520)">
    <rect class="subcomp-box" x="0" y="0" width="120" height="52" />
    <text class="algo-title" x="60" y="23">Smooth SWRR</text>
    <text class="algo-sub" x="60" y="40">NGINX Formula</text>
  </g>

  <g transform="translate(605, 520)">
    <rect class="subcomp-box" x="0" y="0" width="120" height="52" />
    <text class="algo-title" x="60" y="23">Smart Auto</text>
    <text class="algo-sub" x="60" y="40">4-Tier Adaptive</text>
  </g>

  <!-- Collector Bus from 5 Algorithms -> Resilience Proxy Pipeline -->
  <line class="line-solid" x1="105" y1="572" x2="105" y2="605" />
  <line class="line-solid" x1="245" y1="572" x2="245" y2="605" />
  <line class="line-solid" x1="385" y1="572" x2="385" y2="605" />
  <line class="line-solid" x1="525" y1="572" x2="525" y2="605" />
  <line class="line-solid" x1="665" y1="572" x2="665" y2="605" />
  <line class="line-solid" x1="105" y1="605" x2="665" y2="605" />
  <line class="line-solid" x1="385" y1="605" x2="385" y2="640" marker-end="url(#arr-black)" />

  <!-- 6. Resilience Proxy Pipeline -->
  <g transform="translate(145, 640)">
    <rect class="comp-box" x="0" y="0" width="480" height="60" />
    <text class="title-main" x="240" y="26">Resilience Proxy Pipeline</text>
    <text class="title-sub" x="240" y="45">retryRecorder Staged Buffer &amp; 3-State Circuit Breakers</text>
  </g>

  <!-- Connector: Resilience Proxy -> Backend Pool -->
  <line class="line-solid" x1="385" y1="700" x2="385" y2="760" marker-end="url(#arr-black)" />

  <!-- 7. Backend Server Registry & Pool -->
  <g transform="translate(145, 760)">
    <rect class="comp-box" x="0" y="0" width="480" height="60" />
    <text class="title-main" x="240" y="26">Backend Server Registry &amp; Pool</text>
    <text class="title-sub" x="240" y="45">Thread-Safe Node Pointers (sync.RWMutex) &amp; Dynamic Weights</text>
  </g>

  <!-- Fan-out from Pool -> 3 Upstream Backend Nodes -->
  <line class="line-solid" x1="385" y1="820" x2="385" y2="855" />
  <line class="line-solid" x1="150" y1="855" x2="620" y2="855" />
  <line class="line-solid" x1="150" y1="855" x2="150" y2="890" marker-end="url(#arr-black)" />
  <line class="line-solid" x1="385" y1="855" x2="385" y2="890" marker-end="url(#arr-black)" />
  <line class="line-solid" x1="620" y1="855" x2="620" y2="890" marker-end="url(#arr-black)" />

  <!-- 8. Upstream Nodes -->
  <g transform="translate(60, 890)">
    <rect class="subcomp-box" x="0" y="0" width="180" height="55" />
    <text class="algo-title" x="90" y="24">Backend 1 (:8001)</text>
    <text class="algo-sub" x="90" y="42">Weight: 5 | ActiveConns</text>
  </g>

  <g transform="translate(295, 890)">
    <rect class="subcomp-box" x="0" y="0" width="180" height="55" />
    <text class="algo-title" x="90" y="24">Backend 2 (:8002)</text>
    <text class="algo-sub" x="90" y="42">Weight: 3 | ActiveConns</text>
  </g>

  <g transform="translate(530, 890)">
    <rect class="subcomp-box" x="0" y="0" width="180" height="55" />
    <text class="algo-title" x="90" y="24">Backend 3 (:8003)</text>
    <text class="algo-sub" x="90" y="42">Weight: 1 | ActiveConns</text>
  </g>

  <!-- ==================== RIGHT PLANE: CONTROL & TELEMETRY (Center X = 1175) ==================== -->
  <!-- 1. Data-Terminal Console -->
  <g transform="translate(935, 140)">
    <rect class="comp-box" x="0" y="0" width="480" height="65" />
    <text class="title-main" x="240" y="28">Data-Terminal Console (Port :8081)</text>
    <text class="title-sub" x="240" y="48">Dark 4-View Dashboard (Overview, Pool, Lab, Trace) &amp; embed.FS</text>
  </g>

  <!-- Upward Telemetry Stream: Metrics Collector -> Console with 1 Hz SSE Stream Badge -->
  <line class="line-solid" x1="1175" y1="280" x2="1175" y2="205" marker-end="url(#arr-black)" />
  <rect class="badge-rect" x="1105" y="232" width="140" height="22" />
  <text class="badge-text" x="1175" y="247">1 Hz SSE Stream</text>

  <!-- 2. Metrics Collector & Telemetry Broadcaster -->
  <g transform="translate(935, 280)">
    <rect class="comp-box" x="0" y="0" width="480" height="65" />
    <text class="title-main" x="240" y="28">Metrics Collector &amp; Broadcaster</text>
    <text class="title-sub" x="240" y="48">24-Point Ring Buffer &amp; Server-Sent Events (SSE) Dispatcher</text>
  </g>

  <!-- Connector: Metrics Collector -> Chaos Simulator -->
  <line class="line-solid" x1="1175" y1="345" x2="1175" y2="440" marker-end="url(#arr-black)" />

  <!-- 3. Autonomous Chaos Simulator Studio -->
  <g transform="translate(935, 440)">
    <rect class="comp-box" x="0" y="0" width="480" height="65" />
    <text class="title-main" x="240" y="28">Autonomous Chaos Simulator Studio</text>
    <text class="title-sub" x="240" y="48">64 Worker Threads, Poisson Arrival Jitter &amp; chaosBackup</text>
  </g>

  <!-- Connector: Chaos Simulator -> Dual-Mode Health Engine -->
  <line class="line-solid" x1="1175" y1="505" x2="1175" y2="760" marker-end="url(#arr-black)" />

  <!-- 4. Dual-Mode Health Surveillance Engine -->
  <g transform="translate(935, 760)">
    <rect class="comp-box" x="0" y="0" width="480" height="65" />
    <text class="title-main" x="240" y="28">Dual-Mode Health Surveillance Engine</text>
    <text class="title-sub" x="240" y="48">Proactive Jittered 3s Ping &amp; Zero-Latency Socket Interception</text>
  </g>

  <!-- ==================== CROSS-PLANE INTER-TIER HIGHWAY (DEDICATED LANES) ==================== -->
  <!-- Lane 1 (Track X=755): Hot-Swap Policy API (Console -> Strategy Manager) -->
  <path class="line-dash" d="M 935 172 L 755 172 L 755 430 L 625 430" marker-end="url(#arr-black)" />
  <rect class="badge-rect" x="685" y="295" width="140" height="22" />
  <text class="badge-text" x="755" y="310">Hot-Swap Policy API</text>

  <!-- Lane 2 (Track X=885): Record Transaction KPIs (Proxy Pipeline -> Metrics Collector) -->
  <path class="line-solid" d="M 625 670 L 885 670 L 885 312 L 935 312" marker-end="url(#arr-black)" />
  <rect class="badge-rect" x="805" y="490" width="160" height="22" />
  <text class="badge-text" x="885" y="505">Record Transaction KPIs</text>

  <!-- Lane 3 (Track X=785): Chaos Fault Hooks (Chaos Simulator -> Backend Pool) -->
  <path class="line-dash" d="M 935 472 L 785 472 L 785 780 L 625 780" marker-end="url(#arr-black)" />
  <rect class="badge-rect" x="715" y="625" width="140" height="22" />
  <text class="badge-text" x="785" y="640">Chaos Fault Hooks</text>

  <!-- Bidirectional Line: 3s Health Surveillance (Backend Pool <-> Health Engine) -->
  <line class="line-solid" x1="625" y1="800" x2="935" y2="800" marker-end="url(#arr-black)" marker-start="url(#arr-black)" />
  <rect class="badge-rect" x="705" y="789" width="150" height="22" />
  <text class="badge-text" x="780" y="804">3s Health Surveillance</text>

</svg>
</div>
</body>
</html>
