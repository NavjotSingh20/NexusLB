<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: #FFFFFF;
    font-family: "Latin Modern Roman", "Computer Modern", "Times New Roman", Times, serif;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 100%;
  }
  .canvas {
    width: 1320px;
    height: 1370px;
    background: #FFFFFF;
    position: relative;
  }
  svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  /* Activity Action Nodes */
  .act-node {
    fill: #FFFFFF;
    stroke: #000000;
    stroke-width: 1.8px;
    rx: 6px;
  }
  .node-title {
    font-size: 13.5px;
    font-weight: bold;
    fill: #000000;
    text-anchor: middle;
  }
  .node-sub {
    font-size: 11px;
    font-weight: normal;
    fill: #222222;
    text-anchor: middle;
  }

  /* Decision Diamonds */
  .decision-poly {
    fill: #FFFFFF;
    stroke: #000000;
    stroke-width: 1.8px;
  }
  .decision-text {
    font-size: 11.5px;
    font-weight: bold;
    fill: #000000;
    text-anchor: middle;
  }

  /* Initial and Final Nodes */
  .initial-node {
    fill: #000000;
  }
  .final-outer {
    fill: #FFFFFF;
    stroke: #000000;
    stroke-width: 2px;
  }
  .final-inner {
    fill: #000000;
  }

  /* Connectors */
  .conn-solid {
    fill: none;
    stroke: #000000;
    stroke-width: 1.8px;
  }
  .conn-dash {
    fill: none;
    stroke: #000000;
    stroke-width: 1.6px;
    stroke-dasharray: 6,4;
  }

  /* Badges & Labels */
  .badge-bg {
    fill: #FFFFFF;
    stroke: #000000;
    stroke-width: 1px;
    rx: 3px;
  }
  .badge-text {
    font-size: 11px;
    font-weight: bold;
    fill: #000000;
    text-anchor: middle;
  }
</style>
</head>
<body>
<div class="canvas">
<svg viewBox="0 0 1320 1370" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#000000" />
    </marker>
  </defs>

  <!-- ==================== INITIAL NODE ==================== -->
  <circle class="initial-node" cx="650" cy="40" r="13" />
  <path class="conn-solid" d="M 650 53 L 650 85" marker-end="url(#arrow)" />

  <!-- ==================== STEP 1: INGRESS RECEIVES REQUEST ==================== -->
  <g transform="translate(450, 85)">
    <rect class="act-node" x="0" y="0" width="400" height="56" />
    <text class="node-title" x="200" y="24">1. Ingress Receives HTTP Request (:8080)</text>
    <text class="node-sub" x="200" y="44">Extract Client IP, Headers &amp; Ingress Port</text>
  </g>
  <path class="conn-solid" d="M 650 141 L 650 175" marker-end="url(#arrow)" />

  <!-- ==================== DECISION 1: RATE GATE (EDGE SHIELD) ==================== -->
  <!-- Diamond Center: (650, 210), W=220, H=70 -->
  <polygon class="decision-poly" points="650,175 760,210 650,245 540,210" />
  <text class="decision-text" x="650" y="206">Tokens</text>
  <text class="decision-text" x="650" y="222">Available?</text>

  <!-- Decision 1 -> Branch Left (Tokens Exceeded / 429) -->
  <path class="conn-solid" d="M 540 210 L 350 210" marker-end="url(#arrow)" />
  <g transform="translate(445, 210)">
    <rect class="badge-bg" x="-50" y="-11" width="100" height="22" />
    <text class="badge-text" x="0" y="4">[Exceeded: No]</text>
  </g>

  <!-- 429 Rejection Box (X=130, Y=182, W=220, H=56) -->
  <g transform="translate(130, 182)">
    <rect class="act-node" x="0" y="0" width="220" height="56" />
    <text class="node-title" x="110" y="24">Return HTTP 429</text>
    <text class="node-sub" x="110" y="44">Inject Retry-After &amp; Drop Conn</text>
  </g>

  <!-- 429 Box to Terminal End Node -->
  <path class="conn-solid" d="M 240 238 L 240 275" marker-end="url(#arrow)" />
  <circle class="final-outer" cx="240" cy="289" r="14" />
  <circle class="final-inner" cx="240" cy="289" r="8" />

  <!-- Decision 1 -> Downward Spine [Tokens Available: Yes] -->
  <path class="conn-solid" d="M 650 245 L 650 335" marker-end="url(#arrow)" />
  <g transform="translate(650, 290)">
    <rect class="badge-bg" x="-72" y="-11" width="144" height="22" />
    <text class="badge-text" x="0" y="4">[Tokens Available: Yes]</text>
  </g>

  <!-- ==================== DECISION 2: CANARY TRAFFIC STEERING ==================== -->
  <!-- Diamond Center: (650, 370), W=220, H=70 -->
  <polygon class="decision-poly" points="650,335 760,370 650,405 540,370" />
  <text class="decision-text" x="650" y="366">Canary Tag</text>
  <text class="decision-text" x="650" y="382">Present?</text>

  <!-- Decision 2 -> Branch Right [Match: Yes] -->
  <path class="conn-solid" d="M 760 370 L 960 370" marker-end="url(#arrow)" />
  <g transform="translate(860, 370)">
    <rect class="badge-bg" x="-45" y="-11" width="90" height="22" />
    <text class="badge-text" x="0" y="4">[Match: Yes]</text>
  </g>

  <!-- Canary Selection Box (X=960, Y=342, W=240, H=56) -->
  <g transform="translate(960, 342)">
    <rect class="act-node" x="0" y="0" width="240" height="56" />
    <text class="node-title" x="120" y="24">Route to Canary Pool</text>
    <text class="node-sub" x="120" y="44">Select Backend Node (L7 Rule)</text>
  </g>

  <!-- Canary Flow Re-joins Spine at Step 3 (Drops on track X=1080) -->
  <path class="conn-solid" d="M 1080 398 L 1080 778 L 850 778" marker-end="url(#arrow)" />

  <!-- Decision 2 -> Downward Spine [Canary Present: No] -->
  <path class="conn-solid" d="M 650 405 L 650 495" marker-end="url(#arrow)" />
  <g transform="translate(650, 450)">
    <rect class="badge-bg" x="-68" y="-11" width="136" height="22" />
    <text class="badge-text" x="0" y="4">[Canary Present: No]</text>
  </g>

  <!-- ==================== STEP 2: EVALUATE BALANCING ALGORITHM ==================== -->
  <g transform="translate(450, 495)">
    <rect class="act-node" x="0" y="0" width="400" height="56" />
    <text class="node-title" x="200" y="24">2. Evaluate Active Balancing Algorithm</text>
    <text class="node-sub" x="200" y="44">Smart Auto / Round-Robin / LeastConn / SWRR / IPHash</text>
  </g>
  <path class="conn-solid" d="M 650 551 L 650 590" marker-end="url(#arrow)" />

  <!-- ==================== DECISION 3: CIRCUIT BREAKER HEALTH ==================== -->
  <!-- Diamond Center: (650, 625), W=220, H=70 -->
  <polygon class="decision-poly" points="650,590 760,625 650,660 540,625" />
  <text class="decision-text" x="650" y="621">Target Node</text>
  <text class="decision-text" x="650" y="637">Closed?</text>

  <!-- Decision 3 -> Branch Left [State: Open / Tripped] -->
  <path class="conn-solid" d="M 540 625 L 350 625" marker-end="url(#arrow)" />
  <g transform="translate(445, 625)">
    <rect class="badge-bg" x="-45" y="-11" width="90" height="22" />
    <text class="badge-text" x="0" y="4">[State: Open]</text>
  </g>

  <!-- Fast Fail Box (X=130, Y=597, W=220, H=56) -->
  <g transform="translate(130, 597)">
    <rect class="act-node" x="0" y="0" width="220" height="56" />
    <text class="node-title" x="110" y="24">Trip Fast-Fail Rejection</text>
    <text class="node-sub" x="110" y="44">Evict Target from Active Pool</text>
  </g>

  <!-- Fast Fail Loop back up to Step 2 (Outer Track X=65) -->
  <path class="conn-dash" d="M 130 625 L 65 625 L 65 523 L 450 523" marker-end="url(#arrow)" />
  <g transform="translate(255, 523)">
    <rect class="badge-bg" x="-85" y="-11" width="170" height="22" />
    <text class="badge-text" x="0" y="4">Evict &amp; Re-evaluate Sibling</text>
  </g>

  <!-- Decision 3 -> Downward Spine [Circuit State: Closed] -->
  <path class="conn-solid" d="M 650 660 L 650 750" marker-end="url(#arrow)" />
  <g transform="translate(650, 705)">
    <rect class="badge-bg" x="-72" y="-11" width="144" height="22" />
    <text class="badge-text" x="0" y="4">[Circuit State: Closed]</text>
  </g>

  <!-- ==================== STEP 3: BUFFER REQUEST BODY ==================== -->
  <g transform="translate(450, 750)">
    <rect class="act-node" x="0" y="0" width="400" height="56" />
    <text class="node-title" x="200" y="24">3. Buffer Request Body in Staged retryRecorder</text>
    <text class="node-sub" x="200" y="44">Preserve Body for Idempotent Retry Safety</text>
  </g>
  <path class="conn-solid" d="M 650 806 L 650 845" marker-end="url(#arrow)" />

  <!-- ==================== STEP 4: FORWARD REQUEST TO TARGET ==================== -->
  <g transform="translate(450, 845)">
    <rect class="act-node" x="0" y="0" width="400" height="56" />
    <text class="node-title" x="200" y="24">4. Forward Request to Selected Target Node</text>
    <text class="node-sub" x="200" y="44">Execute Staged Reverse Proxy Socket Dispatch</text>
  </g>
  <path class="conn-solid" d="M 650 901 L 650 940" marker-end="url(#arrow)" />

  <!-- ==================== DECISION 4: PROXY RESPONSE INSPECTION ==================== -->
  <!-- Diamond Center: (650, 975), W=220, H=70 -->
  <polygon class="decision-poly" points="650,940 760,975 650,1010 540,975" />
  <text class="decision-text" x="650" y="971">Response</text>
  <text class="decision-text" x="650" y="987">Success?</text>

  <!-- Decision 4 -> Branch Right [Socket Reset / 5xx] -->
  <path class="conn-solid" d="M 760 975 L 960 975" marker-end="url(#arrow)" />
  <g transform="translate(860, 975)">
    <rect class="badge-bg" x="-62" y="-11" width="124" height="22" />
    <text class="badge-text" x="0" y="4">[Socket Reset / 5xx]</text>
  </g>

  <!-- Circuit Breaker Failures Box (X=960, Y=947, W=240, H=56) -->
  <g transform="translate(960, 947)">
    <rect class="act-node" x="0" y="0" width="240" height="56" />
    <text class="node-title" x="120" y="24">Increment Breaker Failures</text>
    <text class="node-sub" x="120" y="44">Stage Replay to Alternate Node</text>
  </g>

  <!-- Replay Loop back up to Step 4 (Outer Track X=1240) -->
  <path class="conn-dash" d="M 1200 975 L 1240 975 L 1240 873 L 850 873" marker-end="url(#arrow)" />
  <g transform="translate(1045, 873)">
    <rect class="badge-bg" x="-68" y="-11" width="136" height="22" />
    <text class="badge-text" x="0" y="4">Replay Body Buffer</text>
  </g>

  <!-- Decision 4 -> Downward Spine [HTTP 200 OK / Success] -->
  <path class="conn-solid" d="M 650 1010 L 650 1100" marker-end="url(#arrow)" />
  <g transform="translate(650, 1055)">
    <rect class="badge-bg" x="-72" y="-11" width="144" height="22" />
    <text class="badge-text" x="0" y="4">[HTTP 200 OK / Success]</text>
  </g>

  <!-- ==================== STEP 5: COMMIT STAGED RESPONSE ==================== -->
  <g transform="translate(450, 1100)">
    <rect class="act-node" x="0" y="0" width="400" height="56" />
    <text class="node-title" x="200" y="24">5. Commit Staged Response to Client</text>
    <text class="node-sub" x="200" y="44">Flush Headers, Status Code &amp; Stream Body</text>
  </g>
  <path class="conn-solid" d="M 650 1156 L 650 1195" marker-end="url(#arrow)" />

  <!-- ==================== STEP 6: PUSH TELEMETRY & SSE ==================== -->
  <g transform="translate(450, 1195)">
    <rect class="act-node" x="0" y="0" width="400" height="56" />
    <text class="node-title" x="200" y="24">6. Push Telemetry to Ring Buffer &amp; Dispatch SSE</text>
    <text class="node-sub" x="200" y="44">Update Percentiles &amp; Broadcast 1 Hz Stream (:8081)</text>
  </g>
  <path class="conn-solid" d="M 650 1251 L 650 1290" marker-end="url(#arrow)" />

  <!-- ==================== FINAL NODE ==================== -->
  <circle class="final-outer" cx="650" cy="1306" r="16" />
  <circle class="final-inner" cx="650" cy="1306" r="9" />

</svg>
</div>
</body>
</html>
