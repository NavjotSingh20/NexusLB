<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: #FFFFFF;
    font-family: "Latin Modern Roman", "Computer Modern", "Times New Roman", Times, serif;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 100%;
  }
  .canvas {
    width: 1400px;
    height: 840px;
    background: #FFFFFF;
    position: relative;
  }
  svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  /* FSM State Circles */
  .state-circle {
    fill: #FFFFFF;
    stroke: #000000;
    stroke-width: 2px;
  }
  .state-divider {
    stroke: #000000;
    stroke-width: 1px;
  }

  /* State Typography */
  .state-title {
    font-size: 17px;
    font-weight: bold;
    fill: #000000;
    text-anchor: middle;
  }
  .state-sub {
    font-size: 12.5px;
    font-weight: normal;
    font-style: italic;
    fill: #111111;
    text-anchor: middle;
  }
  .state-bullet {
    font-size: 11px;
    font-weight: normal;
    fill: #000000;
    text-anchor: middle;
  }
  .state-footer-text {
    font-size: 10.5px;
    font-style: italic;
    fill: #222222;
    text-anchor: middle;
  }

  /* Initial Node */
  .init-node {
    fill: #000000;
  }

  /* Connectors */
  .conn-solid {
    fill: none;
    stroke: #000000;
    stroke-width: 1.8px;
  }
  .conn-dash {
    fill: none;
    stroke: #000000;
    stroke-width: 1.8px;
    stroke-dasharray: 6,4;
  }

  /* Badges & Labels */
  .badge-bg {
    fill: #FFFFFF;
    stroke: #000000;
    stroke-width: 1px;
    rx: 3px;
  }
  .badge-text {
    font-size: 11.5px;
    font-weight: bold;
    fill: #000000;
    text-anchor: middle;
  }
</style>
</head>
<body>
<div class="canvas">
<svg viewBox="0 0 1400 840" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#000000" />
    </marker>
  </defs>

  <!-- ==================== INITIAL PSEUDO-STATE (UML 2.5 STANDARD) ==================== -->
  <!-- Clean vertical entry from top directly into StateClosed apex (X=320) -->
  <circle class="init-node" cx="320" cy="100" r="9" />
  <path class="conn-solid" d="M 320 109 L 320 160" marker-end="url(#arrow)" />


  <!-- ==================== STATE 1: StateClosed (Center X=320, Y=280, R=120) ==================== -->
  <g>
    <circle class="state-circle" cx="320" cy="280" r="120" />
    <text class="state-title" x="320" y="240">StateClosed</text>
    <text class="state-sub" x="320" y="262">Normal Operation</text>
    <line class="state-divider" x1="240" y1="276" x2="400" y2="276" />
    <text class="state-bullet" x="320" y="298">&bull; Traffic forwarded 1:1</text>
    <text class="state-bullet" x="320" y="318">&bull; Failure counter armed</text>
    <text class="state-footer-text" x="320" y="338">Upstream healthy &amp; active</text>
  </g>

  <!-- Self-Loop on StateClosed (Success / Reset) - Symmetrically Isolated on Left -->
  <!-- Exits at (220, 230), loops out to X=85, re-enters cleanly at (220, 330) -->
  <path class="conn-solid" d="M 220 230 C 85 190, 85 370, 220 330" marker-end="url(#arrow)" />
  <g transform="translate(85, 280)">
    <rect class="badge-bg" x="-75" y="-11" width="150" height="22" />
    <text class="badge-text" x="0" y="4">Success: failures = 0</text>
  </g>


  <!-- ==================== STATE 2: StateOpen (Center X=1080, Y=280, R=120) ==================== -->
  <g>
    <circle class="state-circle" cx="1080" cy="280" r="120" />
    <text class="state-title" x="1080" y="240">StateOpen</text>
    <text class="state-sub" x="1080" y="262">Quarantined (Tripped)</text>
    <line class="state-divider" x1="1000" y1="276" x2="1160" y2="276" />
    <text class="state-bullet" x="1080" y="298">&bull; Immediate 503 / Fast-fail</text>
    <text class="state-bullet" x="1080" y="318">&bull; Traffic blocked 100%</text>
    <text class="state-footer-text" x="1080" y="338">Cooldown timer running</text>
  </g>


  <!-- ==================== STATE 3: StateHalfOpen (Center X=700, Y=650, R=120) ==================== -->
  <g>
    <circle class="state-circle" cx="700" cy="650" r="120" />
    <text class="state-title" x="700" y="610">StateHalfOpen</text>
    <text class="state-sub" x="700" y="632">Canary Recovery Trial</text>
    <line class="state-divider" x1="620" y1="646" x2="780" y2="646" />
    <text class="state-bullet" x="700" y="668">&bull; 1 trial probe admitted</text>
    <text class="state-bullet" x="700" y="688">&bull; Concurrent requests held</text>
    <text class="state-footer-text" x="700" y="708">Probing upstream stability</text>
  </g>


  <!-- ==================== TRANSITION 1: CLOSED -> OPEN (Top Horizontal) ==================== -->
  <path class="conn-solid" d="M 440 280 L 960 280" marker-end="url(#arrow)" />
  <g transform="translate(700, 280)">
    <rect class="badge-bg" x="-180" y="-12" width="360" height="24" />
    <text class="badge-text" x="0" y="4">Failures &ge; 5 Consecutive Errors (HTTP 5xx / Reset)</text>
  </g>


  <!-- ==================== TRANSITION 2: OPEN -> HALF-OPEN (Cooldown Elapsed) ==================== -->
  <!-- Direct 45-degree diagonal from (995, 365) to (785, 565) -->
  <path class="conn-solid" d="M 995 365 L 785 565" marker-end="url(#arrow)" />
  <g transform="translate(890, 465)">
    <rect class="badge-bg" x="-105" y="-12" width="210" height="24" />
    <text class="badge-text" x="0" y="4">Cooldown Elapsed (T &ge; 10.0s)</text>
  </g>


  <!-- ==================== TRANSITION 3: HALF-OPEN -> CLOSED (Trial Succeeded) ==================== -->
  <!-- Direct 45-degree diagonal from (615, 565) to (405, 365) -->
  <path class="conn-solid" d="M 615 565 L 405 365" marker-end="url(#arrow)" />
  <g transform="translate(510, 465)">
    <rect class="badge-bg" x="-115" y="-12" width="230" height="24" />
    <text class="badge-text" x="0" y="4">Trial Probe Succeeded (200 OK)</text>
  </g>


  <!-- ==================== TRANSITION 4: HALF-OPEN -> OPEN (Trial Failed / Re-Trip) ==================== -->
  <!-- Clean outer corridor: exits HalfOpen right, goes to X=1260, up to Y=365, into StateOpen -->
  <path class="conn-dash" d="M 820 650 L 1260 650 L 1260 365 L 1165 365" marker-end="url(#arrow)" />
  <g transform="translate(1040, 650)">
    <rect class="badge-bg" x="-110" y="-12" width="220" height="24" />
    <text class="badge-text" x="0" y="4">Trial Probe Failed &rarr; Re-Trip</text>
  </g>

</svg>
</div>
</body>
</html>
