<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: #FFFFFF;
    font-family: "Latin Modern Roman", "Computer Modern", "Times New Roman", Times, serif;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 100%;
  }
  .canvas {
    width: 1500px;
    height: 1160px;
    background: #FFFFFF;
    position: relative;
  }
  svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  /* System Boundary: LaTeX dashed rectangle */
  .system-boundary {
    fill: #FFFFFF;
    stroke: #000000;
    stroke-width: 1.6px;
    stroke-dasharray: 6,4;
    rx: 4px;
  }
  .system-title {
    font-size: 15px;
    font-weight: bold;
    fill: #000000;
    text-anchor: middle;
    letter-spacing: 0.5px;
  }
  .section-label {
    font-size: 12.5px;
    font-weight: bold;
    fill: #000000;
    text-anchor: middle;
    letter-spacing: 0.3px;
  }

  /* Use Case Ellipse: Classic LaTeX TikZ style */
  .uc-ellipse {
    fill: #FFFFFF;
    stroke: #000000;
    stroke-width: 1.5px;
  }
  .uc-title {
    font-size: 13.5px;
    font-weight: bold;
    fill: #000000;
    text-anchor: middle;
  }
  .uc-sub {
    font-size: 11px;
    fill: #333333;
    text-anchor: middle;
    font-style: italic;
  }

  /* Actor Box: LaTeX style */
  .actor-box {
    fill: #FFFFFF;
    stroke: #000000;
    stroke-width: 1.8px;
    rx: 2px;
  }
  .actor-stereo {
    font-size: 11px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
  }
  .actor-name {
    font-size: 14.5px;
    font-weight: bold;
    fill: #000000;
    text-anchor: middle;
  }
  .actor-sub {
    font-size: 11px;
    fill: #444444;
    text-anchor: middle;
  }

  /* Solid Association Lines */
  .assoc-line {
    stroke: #000000;
    stroke-width: 1.4px;
    fill: none;
  }

  /* Dependency Dashed Lines */
  .dep-line {
    stroke: #000000;
    stroke-width: 1.4px;
    stroke-dasharray: 5,4;
    fill: none;
  }

  /* Stereotype Label Pills */
  .stereo-pill {
    fill: #FFFFFF;
    stroke: #000000;
    stroke-width: 0.9px;
    rx: 3px;
  }
  .stereo-text {
    font-size: 10.5px;
    font-style: italic;
    fill: #000000;
    text-anchor: middle;
  }
</style>
</head>
<body>
<div class="canvas">
<svg viewBox="0 0 1500 1160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Open Arrowhead for UML <<include>> and <<extend>> -->
    <marker id="open-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8 5 L 1 8.5" fill="none" stroke="#000000" stroke-width="1.4" />
    </marker>
  </defs>

  <!-- ==================== SYSTEM BOUNDARY ==================== -->
  <rect class="system-boundary" x="230" y="30" width="1010" height="1100" />
  <text class="system-title" x="735" y="58">System: NexusLB Ingress &amp; Reliability Gateway</text>
  <line x1="250" y1="72" x2="1220" y2="72" stroke="#000000" stroke-width="0.8" stroke-dasharray="2,2" />

  <!-- Sub-column Headers -->
  <text class="section-label" x="460" y="95">INGRESS, SECURITY &amp; RELIABILITY (DATA PLANE)</text>
  <text class="section-label" x="960" y="95">CONTROL PLANE, CHAOS &amp; TELEMETRY</text>

  <!-- Central Column Divider Line -->
  <line x1="710" y1="85" x2="710" y2="1110" stroke="#CCCCCC" stroke-width="1" stroke-dasharray="4,4" />

  <!-- ==================== ACTOR 1: CLIENT / CONSUMER (LEFT TOP) ==================== -->
  <g transform="translate(30, 115)">
    <rect class="actor-box" x="0" y="0" width="160" height="65" />
    <text class="actor-stereo" x="80" y="20">&laquo;actor&raquo;</text>
    <text class="actor-name" x="80" y="38">Client / Consumer</text>
    <text class="actor-sub" x="80" y="54">HTTP User / Browser</text>
  </g>

  <!-- Association: Client -> UC1 (Send HTTP Request) -->
  <line class="assoc-line" x1="190" y1="147" x2="290" y2="147" />

  <!-- ==================== ACTOR 2: UPSTREAM CLUSTER (LEFT BOTTOM) ==================== -->
  <g transform="translate(30, 810)">
    <rect class="actor-box" x="0" y="0" width="160" height="65" />
    <text class="actor-stereo" x="80" y="20">&laquo;actor&raquo;</text>
    <text class="actor-name" x="80" y="38">Upstream Cluster</text>
    <text class="actor-sub" x="80" y="54">Nodes :8001 – :8003</text>
  </g>

  <!-- Association: Upstream Cluster -> UC6 (Staged Forwarding) -->
  <line class="assoc-line" x1="190" y1="835" x2="290" y2="727" />

  <!-- Association: Upstream Cluster -> UC8 (Health Verification) -->
  <line class="assoc-line" x1="190" y1="855" x2="290" y2="959" />

  <!-- ==================== ACTOR 3: DEVOPS / ADMIN (RIGHT CENTER) ==================== -->
  <g transform="translate(1290, 485)">
    <rect class="actor-box" x="0" y="0" width="170" height="70" />
    <text class="actor-stereo" x="85" y="20">&laquo;actor&raquo;</text>
    <text class="actor-name" x="85" y="40">DevOps / Admin</text>
    <text class="actor-sub" x="85" y="58">Operations Console (:8081)</text>
  </g>

  <!-- ==================== COLUMN 1 USE CASES (DATA PLANE) ==================== -->
  <!-- UC1: Send HTTP Request -->
  <g transform="translate(460, 147)">
    <ellipse class="uc-ellipse" cx="0" cy="0" rx="170" ry="32" />
    <text class="uc-title" x="0" y="-3">Send HTTP Request</text>
    <text class="uc-sub" x="0" y="14">Ingress Gateway Traffic (:8080)</text>
  </g>

  <!-- Connector UC1 -> UC2 (<<include>>) -->
  <line class="dep-line" x1="460" y1="179" x2="460" y2="231" marker-end="url(#open-arrow)" />
  <rect class="stereo-pill" x="428" y="196" width="64" height="18" />
  <text class="stereo-text" x="460" y="209">&laquo;include&raquo;</text>

  <!-- UC2: Edge Shield Rate Policing -->
  <g transform="translate(460, 263)">
    <ellipse class="uc-ellipse" cx="0" cy="0" rx="170" ry="32" />
    <text class="uc-title" x="0" y="-3">Edge Shield Rate Policing</text>
    <text class="uc-sub" x="0" y="14">Per-IP Token Bucket &amp; 429 Drops</text>
  </g>

  <!-- Connector UC2 -> UC3 (<<include>>) -->
  <line class="dep-line" x1="460" y1="295" x2="460" y2="347" marker-end="url(#open-arrow)" />
  <rect class="stereo-pill" x="428" y="312" width="64" height="18" />
  <text class="stereo-text" x="460" y="325">&laquo;include&raquo;</text>

  <!-- UC3: Inspect Layer 7 Canary Tags -->
  <g transform="translate(460, 379)">
    <ellipse class="uc-ellipse" cx="0" cy="0" rx="170" ry="32" />
    <text class="uc-title" x="0" y="-3">Inspect Layer 7 Canary Tags</text>
    <text class="uc-sub" x="0" y="14">X-Canary, Cookie &amp; Query Parser</text>
  </g>

  <!-- Connector UC3 -> UC4 (<<include>>) -->
  <line class="dep-line" x1="460" y1="411" x2="460" y2="463" marker-end="url(#open-arrow)" />
  <rect class="stereo-pill" x="428" y="428" width="64" height="18" />
  <text class="stereo-text" x="460" y="441">&laquo;include&raquo;</text>

  <!-- UC4: Select Routing Algorithm -->
  <g transform="translate(460, 495)">
    <ellipse class="uc-ellipse" cx="0" cy="0" rx="170" ry="32" />
    <text class="uc-title" x="0" y="-3">Select Routing Algorithm</text>
    <text class="uc-sub" x="0" y="14">RR, LeastConn, IP Hash, SWRR, Auto</text>
  </g>

  <!-- Connector UC4 -> UC5 (<<include>>) -->
  <line class="dep-line" x1="460" y1="527" x2="460" y2="579" marker-end="url(#open-arrow)" />
  <rect class="stereo-pill" x="428" y="544" width="64" height="18" />
  <text class="stereo-text" x="460" y="557">&laquo;include&raquo;</text>

  <!-- UC5: Outlier Detection Check -->
  <g transform="translate(460, 611)">
    <ellipse class="uc-ellipse" cx="0" cy="0" rx="170" ry="32" />
    <text class="uc-title" x="0" y="-3">Outlier Detection Check</text>
    <text class="uc-sub" x="0" y="14">Circuit Breaker (Closed / Open / Half)</text>
  </g>

  <!-- Connector UC5 -> UC6 (<<include>>) -->
  <line class="dep-line" x1="460" y1="643" x2="460" y2="695" marker-end="url(#open-arrow)" />
  <rect class="stereo-pill" x="428" y="660" width="64" height="18" />
  <text class="stereo-text" x="460" y="673">&laquo;include&raquo;</text>

  <!-- UC6: Staged Response Forwarding -->
  <g transform="translate(460, 727)">
    <ellipse class="uc-ellipse" cx="0" cy="0" rx="170" ry="32" />
    <text class="uc-title" x="0" y="-3">Staged Response Forwarding</text>
    <text class="uc-sub" x="0" y="14">retryRecorder Buffer &amp; Node Proxy</text>
  </g>

  <!-- Connector UC6 -> UC7 (<<extend>>) -->
  <line class="dep-line" x1="460" y1="759" x2="460" y2="811" marker-end="url(#open-arrow)" />
  <rect class="stereo-pill" x="429" y="776" width="62" height="18" />
  <text class="stereo-text" x="460" y="789">&laquo;extend&raquo;</text>

  <!-- UC7: Transparent Retry Failover -->
  <g transform="translate(460, 843)">
    <ellipse class="uc-ellipse" cx="0" cy="0" rx="170" ry="32" />
    <text class="uc-title" x="0" y="-3">Transparent Retry Failover</text>
    <text class="uc-sub" x="0" y="14">Idempotent Body Replay to Alt Node</text>
  </g>

  <!-- UC8: Dual-Mode Health Verification -->
  <g transform="translate(460, 959)">
    <ellipse class="uc-ellipse" cx="0" cy="0" rx="170" ry="32" />
    <text class="uc-title" x="0" y="-3">Dual-Mode Health Verification</text>
    <text class="uc-sub" x="0" y="14">Proactive 3s Polling &amp; Reactive Catch</text>
  </g>

  <!-- Central Highway Connector: UC8 -> UC5 (Health updates Outlier Detection) -->
  <!-- Exits right apex of UC8 (X=630, Y=959), goes to X=670, climbs to Y=611, enters right apex of UC5 -->
  <path class="dep-line" d="M 630 959 L 670 959 L 670 611 L 630 611" marker-end="url(#open-arrow)" />
  <rect class="stereo-pill" x="638" y="776" width="64" height="18" />
  <text class="stereo-text" x="670" y="789">&laquo;include&raquo;</text>

  <!-- ==================== COLUMN 2 USE CASES (CONTROL PLANE) ==================== -->
  <!-- UC9: View Live Telemetry -->
  <g transform="translate(960, 147)">
    <ellipse class="uc-ellipse" cx="0" cy="0" rx="170" ry="32" />
    <text class="uc-title" x="0" y="-3">View Live Telemetry</text>
    <text class="uc-sub" x="0" y="14">1 Hz SSE Stream &amp; 24-pt Sliding Ring</text>
  </g>

  <!-- UC10: Hot-Swap Balancer Policy -->
  <g transform="translate(960, 263)">
    <ellipse class="uc-ellipse" cx="0" cy="0" rx="170" ry="32" />
    <text class="uc-title" x="0" y="-3">Hot-Swap Balancer Policy</text>
    <text class="uc-sub" x="0" y="14">Zero-Downtime REST API Control</text>
  </g>

  <!-- UC11: Inspect Heuristic Explainability -->
  <g transform="translate(960, 379)">
    <ellipse class="uc-ellipse" cx="0" cy="0" rx="170" ry="32" />
    <text class="uc-title" x="0" y="-3">Inspect Explainability Log</text>
    <text class="uc-sub" x="0" y="14">4-Tier Cascade Decisions &amp; Auditing</text>
  </g>

  <!-- UC12: Dispatch Chaos Waves -->
  <g transform="translate(960, 495)">
    <ellipse class="uc-ellipse" cx="0" cy="0" rx="170" ry="32" />
    <text class="uc-title" x="0" y="-3">Dispatch Chaos Waves</text>
    <text class="uc-sub" x="0" y="14">6 Attack Vectors (64-Worker Pool)</text>
  </g>

  <!-- UC13: Inject Latency & Node Outages -->
  <g transform="translate(960, 611)">
    <ellipse class="uc-ellipse" cx="0" cy="0" rx="170" ry="32" />
    <text class="uc-title" x="0" y="-3">Inject Latency &amp; Node Outages</text>
    <text class="uc-sub" x="0" y="14">Live Server Toggling &amp; Fault Injection</text>
  </g>

  <!-- UC14: Configure Rate Limit Rules -->
  <g transform="translate(960, 727)">
    <ellipse class="uc-ellipse" cx="0" cy="0" rx="170" ry="32" />
    <text class="uc-title" x="0" y="-3">Configure Rate Limit Rules</text>
    <text class="uc-sub" x="0" y="14">Burst Caps &amp; 60s GC Memory Sweeper</text>
  </g>

  <!-- UC15: Revert Cluster Baseline -->
  <g transform="translate(960, 843)">
    <ellipse class="uc-ellipse" cx="0" cy="0" rx="170" ry="32" />
    <text class="uc-title" x="0" y="-3">Revert Cluster Baseline</text>
    <text class="uc-sub" x="0" y="14">Atomic Rollback via chaosBackup</text>
  </g>

  <!-- ==================== DEVOPS ADMIN CLEAN DIRECT ASSOCIATIONS ==================== -->
  <!-- Direct, clean, non-overlapping straight association lines fanning out from Admin to UC9-UC15 -->
  <line class="assoc-line" x1="1290" y1="495" x2="1130" y2="147" />
  <line class="assoc-line" x1="1290" y1="503" x2="1130" y2="263" />
  <line class="assoc-line" x1="1290" y1="512" x2="1130" y2="379" />
  <line class="assoc-line" x1="1290" y1="520" x2="1130" y2="495" />
  <line class="assoc-line" x1="1290" y1="528" x2="1130" y2="611" />
  <line class="assoc-line" x1="1290" y1="537" x2="1130" y2="727" />
  <line class="assoc-line" x1="1290" y1="545" x2="1130" y2="843" />

</svg>
</div>
</body>
</html>
