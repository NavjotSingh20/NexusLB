<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: #FFFFFF;
    font-family: "Latin Modern Roman", "Computer Modern", "Times New Roman", Times, serif;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 100%;
  }
  .canvas {
    width: 1540px;
    height: 1040px;
    background: #FFFFFF;
    position: relative;
  }
  svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  /* UML Class Boxes */
  .class-box {
    fill: #FFFFFF;
    stroke: #000000;
    stroke-width: 1.8px;
    rx: 3px;
  }
  .class-divider {
    stroke: #000000;
    stroke-width: 1.2px;
  }

  /* Class Headers */
  .class-title {
    font-size: 15px;
    font-weight: bold;
    fill: #000000;
    text-anchor: middle;
  }
  .class-pkg {
    font-size: 11px;
    font-weight: normal;
    font-style: italic;
    fill: #222222;
    text-anchor: middle;
  }
  .interface-tag {
    font-size: 12px;
    font-weight: bold;
    fill: #000000;
    text-anchor: middle;
  }

  /* Class Body Text (Code font) */
  .code-text {
    font-family: "Consolas", "Courier New", monospace;
    font-size: 11px;
    fill: #000000;
    text-anchor: start;
  }
  .interface-desc {
    font-size: 11.5px;
    font-style: italic;
    fill: #111111;
    text-anchor: middle;
  }

  /* Connectors */
  .conn-solid {
    fill: none;
    stroke: #000000;
    stroke-width: 1.6px;
  }
  .conn-dash {
    fill: none;
    stroke: #000000;
    stroke-width: 1.6px;
    stroke-dasharray: 6,4;
  }

  /* Badges & Markers */
  .badge-bg {
    fill: #FFFFFF;
    stroke: #000000;
    stroke-width: 1px;
    rx: 3px;
  }
  .badge-text {
    font-size: 11px;
    font-weight: bold;
    fill: #000000;
    text-anchor: middle;
  }
  .aggr-diamond {
    fill: #FFFFFF;
    stroke: #000000;
    stroke-width: 1.6px;
  }
  .impl-triangle {
    fill: #FFFFFF;
    stroke: #000000;
    stroke-width: 1.6px;
  }
</style>
</head>
<body>
<div class="canvas">
<svg viewBox="0 0 1540 1040" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#000000" />
    </marker>
  </defs>

  <!-- ==================== ROW 1: PRIMARY GATEWAY & CORE CLASSES ==================== -->
  <!-- 1. ReverseProxy (X=50, Y=40, W=400, H=280) -->
  <g transform="translate(50, 40)">
    <rect class="class-box" x="0" y="0" width="400" height="280" />
    <text class="class-title" x="200" y="26">ReverseProxy</text>
    <text class="class-pkg" x="200" y="44">pkg/proxy/proxy.go</text>
    <line class="class-divider" x1="0" y1="54" x2="400" y2="54" />

    <!-- Attributes -->
    <text class="code-text" x="14" y="74">- proxy : *httputil.ReverseProxy</text>
    <text class="code-text" x="14" y="93">- manager : *StrategyManager</text>
    <text class="code-text" x="14" y="112">- limiter : *Limiter</text>
    <text class="code-text" x="14" y="131">- metrics : *MetricsCollector</text>
    <text class="code-text" x="14" y="150">- maxRetries : int</text>
    <line class="class-divider" x1="0" y1="164" x2="400" y2="164" />

    <!-- Methods -->
    <text class="code-text" x="14" y="184">+ ServeHTTP(w ResponseWriter, r *Request)</text>
    <text class="code-text" x="14" y="205">+ ErrorHandler(w, r, err error)</text>
    <text class="code-text" x="14" y="226">+ ModifyResponse(resp *Response) error</text>
    <text class="code-text" x="14" y="247">+ replayRequest(r *Request, b *Backend)</text>
  </g>

  <!-- 2. StrategyManager (X=570, Y=40, W=400, H=280) -->
  <g transform="translate(570, 40)">
    <rect class="class-box" x="0" y="0" width="400" height="280" />
    <text class="class-title" x="200" y="26">StrategyManager</text>
    <text class="class-pkg" x="200" y="44">pkg/strategy/manager.go</text>
    <line class="class-divider" x1="0" y1="54" x2="400" y2="54" />

    <!-- Attributes -->
    <text class="code-text" x="14" y="74">- current : Balancer</text>
    <text class="code-text" x="14" y="93">- strategies : map[string]Balancer</text>
    <text class="code-text" x="14" y="112">- canaryPool : []*Backend</text>
    <text class="code-text" x="14" y="131">- mu : sync.RWMutex</text>
    <text class="code-text" x="14" y="150">- canaryRatio : float64</text>
    <line class="class-divider" x1="0" y1="164" x2="400" y2="164" />

    <!-- Methods -->
    <text class="code-text" x="14" y="184">+ SetStrategy(name string) error</text>
    <text class="code-text" x="14" y="205">+ NextBackend(b []*Backend, r *Request) (*Backend, err)</text>
    <text class="code-text" x="14" y="226">+ GetCurrentName() string</text>
    <text class="code-text" x="14" y="247">+ RegisterStrategy(name string, b Balancer)</text>
  </g>

  <!-- 3. Backend (X=1090, Y=40, W=400, H=280) -->
  <g transform="translate(1090, 40)">
    <rect class="class-box" x="0" y="0" width="400" height="280" />
    <text class="class-title" x="200" y="26">Backend</text>
    <text class="class-pkg" x="200" y="44">pkg/proxy/backend.go</text>
    <line class="class-divider" x1="0" y1="54" x2="400" y2="54" />

    <!-- Attributes -->
    <text class="code-text" x="14" y="74">- URL : *url.URL</text>
    <text class="code-text" x="14" y="93">- Alive : bool</text>
    <text class="code-text" x="14" y="112">- Weight : int</text>
    <text class="code-text" x="14" y="131">- EffectiveWeight : int</text>
    <text class="code-text" x="14" y="150">- ActiveConns : int64 / CB : *CircuitBreaker</text>
    <line class="class-divider" x1="0" y1="164" x2="400" y2="164" />

    <!-- Methods -->
    <text class="code-text" x="14" y="184">+ IsAlive() bool</text>
    <text class="code-text" x="14" y="205">+ SetAlive(alive bool)</text>
    <text class="code-text" x="14" y="226">+ IncConns() / DecConns()</text>
    <text class="code-text" x="14" y="247">+ GetActiveConns() int64 / GetURL() *url.URL</text>
  </g>

  <!-- Horizontal Connections Row 1 -->
  <!-- ReverseProxy -> StrategyManager -->
  <path class="conn-solid" d="M 450 160 L 570 160" marker-end="url(#arrow)" />
  <g transform="translate(510, 160)">
    <rect class="badge-bg" x="-32" y="-11" width="64" height="22" />
    <text class="badge-text" x="0" y="4">routes to</text>
  </g>

  <!-- StrategyManager -> Backend -->
  <path class="conn-solid" d="M 970 160 L 1090 160" marker-end="url(#arrow)" />
  <g transform="translate(1030, 160)">
    <rect class="badge-bg" x="-34" y="-11" width="68" height="22" />
    <text class="badge-text" x="0" y="4">dispatches</text>
  </g>


  <!-- ==================== ROW 2: SUBSYSTEMS & STRATEGY INTERFACE ==================== -->
  <!-- 4. Limiter (X=50, Y=430, W=400, H=230) -->
  <g transform="translate(50, 430)">
    <rect class="class-box" x="0" y="0" width="400" height="230" />
    <text class="class-title" x="200" y="25">Limiter (Edge Shield)</text>
    <text class="class-pkg" x="200" y="43">pkg/limiter/limiter.go</text>
    <line class="class-divider" x1="0" y1="52" x2="400" y2="52" />

    <!-- Attributes -->
    <text class="code-text" x="14" y="73">- buckets : sync.Map</text>
    <text class="code-text" x="14" y="93">- rate : float64 (tokens/sec)</text>
    <text class="code-text" x="14" y="113">- burst : int / ttl : time.Duration (60s)</text>
    <line class="class-divider" x1="0" y1="126" x2="400" y2="126" />

    <!-- Methods -->
    <text class="code-text" x="14" y="146">+ Allow(ip string) bool</text>
    <text class="code-text" x="14" y="167">+ StartSweeper(ctx context.Context)</text>
    <text class="code-text" x="14" y="188">+ getBucket(ip string) *tokenBucket</text>
    <text class="code-text" x="14" y="209">+ GetActiveIPCount() int</text>
  </g>

  <!-- 5. <<interface>> Balancer (X=570, Y=430, W=400, H=230) -->
  <g transform="translate(570, 430)">
    <rect class="class-box" x="0" y="0" width="400" height="230" />
    <text class="interface-tag" x="200" y="24">&laquo;interface&raquo;</text>
    <text class="class-title" x="200" y="44">Balancer</text>
    <text class="class-pkg" x="200" y="60">pkg/strategy/strategy.go</text>
    <line class="class-divider" x1="0" y1="70" x2="400" y2="70" />

    <!-- Contract description -->
    <text class="interface-desc" x="200" y="96">Polymorphic Strategy Contract</text>
    <line class="class-divider" x1="0" y1="116" x2="400" y2="116" />

    <!-- Methods -->
    <text class="code-text" x="14" y="142">+ NextBackend(b []*Backend, r *Request) (*Backend, err)</text>
    <text class="code-text" x="14" y="167">+ Name() string</text>
    <text class="code-text" x="14" y="192">+ Reset()</text>
  </g>

  <!-- 6. CircuitBreaker (X=1090, Y=430, W=400, H=230) -->
  <g transform="translate(1090, 430)">
    <rect class="class-box" x="0" y="0" width="400" height="230" />
    <text class="class-title" x="200" y="25">CircuitBreaker</text>
    <text class="class-pkg" x="200" y="43">pkg/breaker/breaker.go</text>
    <line class="class-divider" x1="0" y1="52" x2="400" y2="52" />

    <!-- Attributes -->
    <text class="code-text" x="14" y="73">- state : CircuitState (Closed / Open / HalfOpen)</text>
    <text class="code-text" x="14" y="93">- failures : uint32 / cooldown : time.Duration (10s)</text>
    <text class="code-text" x="14" y="113">- lastTripped : time.Time / mu : sync.Mutex</text>
    <line class="class-divider" x1="0" y1="126" x2="400" y2="126" />

    <!-- Methods -->
    <text class="code-text" x="14" y="146">+ Allow() bool</text>
    <text class="code-text" x="14" y="167">+ RecordResult(err error)</text>
    <text class="code-text" x="14" y="188">+ GetState() CircuitState</text>
    <text class="code-text" x="14" y="209">+ Trip() / Reset()</text>
  </g>

  <!-- Vertical Connections Row 1 to Row 2 (With UML Aggregation Diamonds) -->
  <!-- ReverseProxy -> Limiter -->
  <polygon class="aggr-diamond" points="250,320 257,330 250,340 243,330" />
  <path class="conn-solid" d="M 250 340 L 250 430" />
  <g transform="translate(250, 385)">
    <rect class="badge-bg" x="-32" y="-11" width="64" height="22" />
    <text class="badge-text" x="0" y="4">enforces</text>
  </g>

  <!-- StrategyManager -> Balancer Interface -->
  <polygon class="aggr-diamond" points="770,320 777,330 770,340 763,330" />
  <path class="conn-solid" d="M 770 340 L 770 430" />
  <g transform="translate(770, 385)">
    <rect class="badge-bg" x="-32" y="-11" width="64" height="22" />
    <text class="badge-text" x="0" y="4">manages</text>
  </g>

  <!-- Backend -> CircuitBreaker -->
  <polygon class="aggr-diamond" points="1290,320 1297,330 1290,340 1283,330" />
  <path class="conn-solid" d="M 1290 340 L 1290 430" />
  <g transform="translate(1290, 385)">
    <rect class="badge-bg" x="-45" y="-11" width="90" height="22" />
    <text class="badge-text" x="0" y="4">monitored by</text>
  </g>


  <!-- ==================== ROW 3: 5 CONCRETE STRATEGY REALIZATIONS ==================== -->
  <!-- Realization Triangle Marker (Touches bottom of Balancer Interface at Y=660) -->
  <polygon class="impl-triangle" points="770,660 760,676 780,676" />

  <!-- Vertical Trunk to Realization Bus -->
  <path class="conn-dash" d="M 770 676 L 770 735" />

  <!-- Horizontal Realization Bus (Spanning X=170 to X=1370 at Y=735) -->
  <path class="conn-dash" d="M 170 735 L 1370 735" />

  <!-- Centered Realization Badge (Neatly masking the T-Junction) -->
  <g transform="translate(770, 735)">
    <rect class="badge-bg" x="-95" y="-11" width="190" height="22" />
    <text class="badge-text" x="0" y="4">&laquo;realizes Balancer interface&raquo;</text>
  </g>

  <!-- Branch Drops from Bus into Row 3 Classes -->
  <path class="conn-dash" d="M 170 735 L 170 800" />
  <path class="conn-dash" d="M 470 735 L 470 800" />
  <!-- Center branch from badge bottom to IPHash -->
  <path class="conn-dash" d="M 770 746 L 770 800" />
  <path class="conn-dash" d="M 1070 735 L 1070 800" />
  <path class="conn-dash" d="M 1370 735 L 1370 800" />

  <!-- 1. RoundRobin (X=40 to 300, Center X=170, Y=800, W=260, H=190) -->
  <g transform="translate(40, 800)">
    <rect class="class-box" x="0" y="0" width="260" height="190" />
    <text class="class-title" x="130" y="24">RoundRobin</text>
    <text class="class-pkg" x="130" y="40">atomic pointer</text>
    <line class="class-divider" x1="0" y1="48" x2="260" y2="48" />
    <text class="code-text" x="12" y="70">- current : uint64</text>
    <line class="class-divider" x1="0" y1="84" x2="260" y2="84" />
    <text class="code-text" x="12" y="110">+ NextBackend(...)</text>
    <text class="code-text" x="12" y="134">+ Name(): "round_robin"</text>
    <text class="code-text" x="12" y="158">+ Reset()</text>
  </g>

  <!-- 2. LeastConn (X=340 to 600, Center X=470, Y=800, W=260, H=190) -->
  <g transform="translate(340, 800)">
    <rect class="class-box" x="0" y="0" width="260" height="190" />
    <text class="class-title" x="130" y="24">LeastConn</text>
    <text class="class-pkg" x="130" y="40">rotating tiebreaker</text>
    <line class="class-divider" x1="0" y1="48" x2="260" y2="48" />
    <text class="code-text" x="12" y="70">- offset : uint64</text>
    <line class="class-divider" x1="0" y1="84" x2="260" y2="84" />
    <text class="code-text" x="12" y="110">+ NextBackend(...)</text>
    <text class="code-text" x="12" y="134">+ Name(): "least_conn"</text>
    <text class="code-text" x="12" y="158">+ Reset()</text>
  </g>

  <!-- 3. IPHash (X=640 to 900, Center X=770, Y=800, W=260, H=190) -->
  <g transform="translate(640, 800)">
    <rect class="class-box" x="0" y="0" width="260" height="190" />
    <text class="class-title" x="130" y="24">IPHash</text>
    <text class="class-pkg" x="130" y="40">fnv-1a deterministic</text>
    <line class="class-divider" x1="0" y1="48" x2="260" y2="48" />
    <text class="code-text" x="12" y="70">- hashFn : HashFunc</text>
    <line class="class-divider" x1="0" y1="84" x2="260" y2="84" />
    <text class="code-text" x="12" y="110">+ NextBackend(...)</text>
    <text class="code-text" x="12" y="134">+ Name(): "ip_hash"</text>
    <text class="code-text" x="12" y="158">+ Reset()</text>
  </g>

  <!-- 4. SmoothWRR (X=940 to 1200, Center X=1070, Y=800, W=260, H=190) -->
  <g transform="translate(940, 800)">
    <rect class="class-box" x="0" y="0" width="260" height="190" />
    <text class="class-title" x="130" y="24">SmoothWRR</text>
    <text class="class-pkg" x="130" y="40">nginx smooth interleaving</text>
    <line class="class-divider" x1="0" y1="48" x2="260" y2="48" />
    <text class="code-text" x="12" y="66">- curWeights : []int</text>
    <text class="code-text" x="12" y="84">- totalWeight : int</text>
    <line class="class-divider" x1="0" y1="94" x2="260" y2="94" />
    <text class="code-text" x="12" y="114">+ NextBackend(...)</text>
    <text class="code-text" x="12" y="136">+ Name(): "smooth_wrr"</text>
    <text class="code-text" x="12" y="158">+ Reset()</text>
  </g>

  <!-- 5. Adaptive (X=1240 to 1500, Center X=1370, Y=800, W=260, H=190) -->
  <g transform="translate(1240, 800)">
    <rect class="class-box" x="0" y="0" width="260" height="190" />
    <text class="class-title" x="130" y="24">Adaptive</text>
    <text class="class-pkg" x="130" y="40">4-tier priority cascade</text>
    <line class="class-divider" x1="0" y1="48" x2="260" y2="48" />
    <text class="code-text" x="12" y="66">- history : []Event</text>
    <text class="code-text" x="12" y="84">- lastSwitch : time.Time</text>
    <line class="class-divider" x1="0" y1="94" x2="260" y2="94" />
    <text class="code-text" x="12" y="114">+ NextBackend(...)</text>
    <text class="code-text" x="12" y="136">+ Name(): "smart_auto"</text>
    <text class="code-text" x="12" y="158">+ Reset()</text>
  </g>

</svg>
</div>
</body>
</html>
